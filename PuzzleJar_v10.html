<body>

  </div>
</header>
<main><div id="board"></div></main>
<div id="bar">

</div>

<div id="room"><button id="rback">‹ Back</button><div id="rbody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div></div><div id="toast"></div>
<div id="set"><div class="card"><h2>Settings</h2><button class="opt" id="snd"></button><button class="opt" id="cbm"></button><button class="opt" id="sng"></button><button class="opt" id="mus"></button><button class="opt" id="cvdb"></button><button class="opt" id="sty"></button><button class="opt" id="thm"></button><button id="closeSet">Done</button></div></div>
<div id="lb"><div class="card"><h2>Pourfect Ranks</h2><div id="lbme"></div><div id="lbtab"><button data-s="g" class="on">🌍 Global</button><button data-s="c">My country</button></div><select id="cty" aria-label="Your country"></select><div id="lbmsg"></div><ol id="lbl"></ol><button id="closeLb">Done</button></div></div>

<div id="win"><div class="card"><h2>Level complete</h2><div id="stars">★★★</div><p id="wmsg"></p><button class="opt" id="shareWin">Share result</button><button class="opt" id="toMap">Back to map</button><button id="next">Next level</button></div></div>
<script>
const COLORS=['#FF5A5F','#FF9F1C','#FFD93D','#7BD63F','#1FC7B6','#3FA9F5','#4F5BD5','#9B5DE5','#F15BB5','#A47148','#E8EEF2','#7A1F4B'];
const SYM=['●','▲','★','■','◆','♥','✚','⬟','☾','✖','⬢','♦'];
const CAP=4;
let level=1,coins=0,sound=true,cb=false,single=false,maxLv=1,theme=0,owned=[0],country='',totalStars=0,xp=0,streak=0,lastDay=-1,dailies=0,daily=false,music=true,bests={},lst={},nick='',enter=false,limit=0;
let jars=[],sel=-1,hist=[],moves=0,combo=0,extraUsed=false,hints=3,won=false,lastPour=null,hintPair=null,par=0;
try{level=+localStorage.getItem('pf_level')||1;coins=+localStorage.getItem('pf_coins')||0;cb=localStorage.getItem('pf_cb')==='1';single=localStorage.getItem('pf_single')==='1';maxLv=+localStorage.getItem('pf_max')||level;theme=+localStorage.getItem('pf_theme')||0;totalStars=+localStorage.getItem('pf_stars')||0;country=localStorage.getItem('pf_cty')||((navigator.language||'').split('-')[1]||'').toUpperCase();owned=JSON.parse(localStorage.getItem('pf_owned')||'[0]');sound=localStorage.getItem('pf_snd')!=='0';xp=+localStorage.getItem('pf_xp')||0;streak=+localStorage.getItem('pf_streak')||0;lastDay=+(localStorage.getItem('pf_last')||-1);dailies=+localStorage.getItem('pf_dn')||0;music=localStorage.getItem('pf_mus')!=='0';bests=JSON.parse(localStorage.getItem('pf_best')||'{}');nick=localStorage.getItem('pf_nick')||'';lst=JSON.parse(localStorage.getItem('pf_lst')||'{}')}catch(e){}
function save(){try{localStorage.setItem('pf_level',level);localStorage.setItem('pf_coins',coins);localStorage.setItem('pf_cb',cb?'1':'0');localStorage.setItem('pf_single',single?'1':'0');localStorage.setItem('pf_max',maxLv);localStorage.setItem('pf_theme',theme);localStorage.setItem('pf_stars',totalStars);localStorage.setItem('pf_cty',country);localStorage.setItem('pf_owned',JSON.stringify(owned));localStorage.setItem('pf_snd',sound?'1':'0');localStorage.setItem('pf_xp',xp);localStorage.setItem('pf_streak',streak);localStorage.setItem('pf_last',lastDay);localStorage.setItem('pf_dn',dailies);localStorage.setItem('pf_mus',music?'1':'0');localStorage.setItem('pf_best',JSON.stringify(bests));localStorage.setItem('pf_nick',nick);localStorage.setItem('pf_lst',JSON.stringify(lst))}catch(e){}}
function dayIdx(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
const $=id=>document.getElementById(id);

/* audio */
let ac=null;
function tone(f,d,type,delay,slideTo){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(OUT());o.start(t);o.stop(t+d+.02)}catch(e){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

/* logic */
let rnd=Math.random;function mul(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solvable(s){return !!solveBoard(s,60)}
const uniform=j=>j.length>0&&j.every(x=>x%100===j[0]%100);
const full=j=>j.length===CAP&&uniform(j);
function gen(){const L=daily?100000+dayIdx():level,b=(!daily&&contractLevel(L))?contractForLevel(L):(!daily&&lockedLevel(L))?lockedForLevel(L):boardForLevel(L,daily?5:plainTier(L));jars=b.jars;LOCKS=b.locks||[];CONTRACT=b.contract||[];rnd=mul(L*7919+13);let hid=0;
  if(level>=2||daily){const p=(!daily&&fogLevel(L))?1:daily?.3:Math.min(.6,.1+(level-2)*.025);jars.forEach(j=>{for(let k=0;k<j.length-1;k++)if(rnd()<p){j[k]+=100;hid++}})}
  par=b.par+Math.floor(hid/4);limit=(!daily&&level%10===0)?Math.ceil(par*2):0}
function chunk(j){let k=1;while(k<j.length&&j[j.length-1-k]===j[j.length-1])k++;return k}
function can(a,b){return !sealedNow(a)&&!sealedNow(b)&&canBase(a,b)&&!contractMsg(a,b)}
function canBase(a,b){if(a===b)return false;const A=jars[a],B=jars[b];if(!A.length||B.length>=CAP)return false;return !B.length||B[B.length-1]===A[A.length-1]}
function anyMove(){for(let a=0;a<jars.length;a++)for(let b=0;b<jars.length;b++)if(can(a,b))return true;return false}
function isWon(){return jars.every(j=>j.length===0||full(j))}
function snap(){hist.push({jars:JSON.stringify(jars),moves,extraUsed})}

function pour(a,b){
  snap();
  const A=jars[a],B=jars[b];
  const n=single?1:Math.min(chunk(A),CAP-B.length),c=A[A.length-1];
  for(let i=0;i<n;i++){A.pop();B.push(c)}if(A.length&&A[A.length-1]>=100)A[A.length-1]-=100;if(full(B))B.forEach((x,i)=>{B[i]=x%100});
  moves++;combo++;
  lastPour={to:b,n};hintPair=null;
  tone(300+Math.min(combo,8)*45,.22,'sine',0,180+Math.min(combo,8)*30);
  if(full(B)){tone(660,.25,'triangle',.12);tone(880,.3,'triangle',.24);buzz(30)}else buzz(8);
}

/* render */
function render(){
  const bd=$('board');bd.innerHTML='';document.documentElement.style.setProperty('--cols',jars.length<=5?jars.length:Math.ceil(jars.length/2));
  jars.forEach((j,i)=>{
    const d=document.createElement('div');
    d.className='jar'+(enter?' enter':'')+(i===sel?' sel':'')+(hintPair&&(hintPair[0]===i||hintPair[1]===i)?' hint':'')+(full(j)?' done':'')+(lastPour&&lastPour.to===i&&full(j)?' cel':'');
    d.setAttribute('role','button');d.setAttribute('aria-label','Jar '+(i+1));if(enter)d.style.animationDelay=i*45+'ms';
    j.forEach((c,k)=>{
      const l=document.createElement('div');
      l.className='layer'+(lastPour&&lastPour.to===i&&k>=j.length-lastPour.n?' new':'');
      l.style.background=c>=100?'#6b7a99':COLORS[c%100];
      l.textContent=c>=100?'?':(cb?SYM[c]:'');
      d.appendChild(l);
    });
    d.onclick=()=>tap(i);
    bd.appendChild(d);
  });
  lastPour=null;enter=false;decorate();
  $('lvl').textContent=(daily?'Daily':'Lv '+level)+(limit?' · '+(limit-moves)+' left':'')+' ▾';
  $('coins').textContent='🪙 '+coins;
  $('hb').textContent=hints;$('extra').classList.toggle('pulse',!won&&!extraUsed&&!anyMove());
  $('hint').disabled=hints<=0;
  $('extra').disabled=extraUsed;
  $('undo').disabled=!hist.length;
  $('mus').textContent='Music: '+(music?'On':'Off');$('mus').setAttribute('aria-pressed',music);$('snd').textContent='Sound: '+(sound?'On':'Off');$('snd').setAttribute('aria-pressed',sound);
  $('cbm').textContent='Symbols on colors: '+(cb?'On':'Off');$('cbm').setAttribute('aria-pressed',cb);$('sng').textContent='Move one card at a time: '+(single?'On':'Off');$('sng').setAttribute('aria-pressed',single);$('thm').textContent='Theme: '+THEMES[theme].n+(owned.includes(theme)?'':' 🔒 '+THEMES[theme].cost+' 🪙')+(thmMsg?' ('+thmMsg+')':'');
}

function tap(i){
  if(won)return;
  if(ac&&ac.state==='suspended')ac.resume();
  if(sel===-1){
    if(jars[i].length&&!full(jars[i])){sel=i;tone(520,.08,'sine');render()}
    return;
  }
  if(sel===i){sel=-1;render();return}
  if(can(sel,i)){
    const from=sel;sel=-1;pour(from,i);render();
    if(isWon())return setTimeout(win,420);if(limit&&moves>=limit){toast('Out of moves! Restarting…');return setTimeout(start,1200)}
    if(!anyMove())toast('No moves left. Try Undo or ＋ Jar.');else if(solveBoard(jars,30,LOCKS,CONTRACT)===null)toast('Dead end: undo, or add a ＋ Jar.');
  }else{
    tone(150,.12,'square');buzz(15);
    if(jars[i].length&&!full(jars[i]))sel=i;else sel=-1;
    combo=0;render();
  }
}

function win(){
  won=true;
  const stars=moves<=par?3:moves<=par*1.5?2:1;
  let reward=10+Math.min(20,level)+(stars===3?10:0),extra='';
  let nb=false;if(daily){const d=dayIdx();if(lastDay!==d){streak=(lastDay===d-1)?streak+1:1;lastDay=d;dailies++;reward+=50;extra=' · Daily +50 · 🔥'+streak}else extra=' · Daily already done today'}else{if(!bests[level]||moves<bests[level]){nb=!!bests[level];bests[level]=moves}lst[level]=Math.max(lst[level]||0,stars);if(level>=maxLv)maxLv=level+1;if(level%10===0){reward+=50;extra=' · Chapter complete +50'}}xp+=20+stars*10+(daily?40:0);coins+=reward;totalStars+=stars;save();post();confetti();
  $('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('wmsg').textContent=moves+' moves · +'+reward+' coins'+extra+(nb?' · New best!':'');
  fanfare(stars);buzz(60);
  $('win').classList.add('on');render();
}

function startBase(){
  gen();enter=true;sel=-1;hist=[];moves=0;combo=0;extraUsed=false;hints=3;won=false;hintPair=null;
  $('win').classList.remove('on');applyTheme();render();if(limit)toast('Boss level: clear it within '+limit+' moves!');else if(level===2)toast('New: ? layers show their color when they reach the top');
}

/* controls */
$('undo').onclick=()=>{
  if(!hist.length||won)return;
  const s=hist.pop();jars=JSON.parse(s.jars);moves=s.moves;extraUsed=s.extraUsed;sel=-1;combo=0;hintPair=null;tone(240,.12,'sine');render();
};

function jarLabel(j,i){if(!j.length)return 'Jar '+(i+1)+': empty';const p=[];let k=0;while(k<j.length){let m=k;while(m<j.length&&((j[m]>=100)===(j[k]>=100))&&(j[k]>=100||j[m]===j[k]))m++;p.push((m-k)+' '+(j[k]>=100?'hidden':NAMES[j[k]])+' card'+(m-k>1?'s':''));k=m}const t=j[j.length-1];return 'Jar '+(i+1)+': '+p.join(', ')+'. Top card is '+(t>=100?'hidden':NAMES[t])+'.'}
let PQ3='',NEARCHK=false,TUT=null,almostShown=false;
function fitBoard(){const bd=$('board'),R=document.documentElement,n=jars.length;if(!bd||!n)return;
  const W=Math.min(innerWidth,520)-24,gx=10,gy=26,top=bd.getBoundingClientRect().top,bar=$('bar').offsetHeight||90,H=Math.max(120,innerHeight-top-bar-30),cols=n<=5?n:5,rows=Math.ceil(n/cols);
  let jw=Math.min(76,Math.floor((W-(cols-1)*gx)/cols));const hh=w=>rows*(w*.6*CAP+18)+(rows-1)*gy;while(jw>26&&hh(jw)>H)jw--;
  R.style.setProperty('--cols',cols);R.style.setProperty('--jw',jw+'px')}
addEventListener('resize',()=>{if(typeof jars!=='undefined'&&jars.length)fitBoard()});
function decorate(){const bd=$('board');if(!bd)return;fitBoard();let q3='';
  for(let i=0;i<bd.children.length;i++){const j=jars[i],el=bd.children[i];if(!j)continue;const lk=LOCKS.find(l=>l.j===i),sl=lk&&sealedNow(i);el.classList.toggle('sealed',!!sl);const ol=el.querySelector('.lk');if(ol)ol.remove();if(sl){const bx=document.createElement('div');bx.className='lk';bx.innerHTML='🔒<i></i>';const q=bx.querySelector('i');q.style.background=COLORS[lk.k];if(cvd!=='off')q.style.backgroundImage=TEX[lk.k];q.textContent=SYM[lk.k];el.appendChild(bx)}el.setAttribute('aria-label',jarLabel(j,i)+(sl?' Sealed. Complete the '+NAMES[lk.k]+' jar to unlock.':''));
    if(cvd!=='off')for(let k=0;k<el.children.length;k++){const c=j[k];if(c===undefined||c>=100)continue;el.children[k].style.backgroundImage=TEX[c];el.children[k].textContent=SYM[c]}
    const near=j.length===CAP-1&&j.every(v=>v<100&&v===j[0]);el.classList.toggle('q3',near);if(near)q3+=i+','}
  if(NEARCHK&&q3&&q3!==PQ3){tone(1760,.3,'sine')}PQ3=q3;const sc=LOCKS.filter(l=>sealedNow(l.j)).length;if(NEARCHK&&sc<PSC){tone(220,.05,'triangle');tone(330,.07,'triangle',.08);buzz(35);toast('🔓 Seal broken!')}PSC=sc;
  let c=$('cmb');if(!c){c=document.createElement('div');c.id='cmb';bd.before(c)}c.textContent=combo>=2?'×'+combo:'';c.className=combo>=2?'on':'';c.style.color='hsl('+Math.max(0,50-combo*6)+',100%,60%)';
  let ct=$('ctb');if(CONTRACT.length){if(!ct){ct=document.createElement('div');ct.id='ctb';$('cmb').before(ct)}ct.innerHTML='';ct.setAttribute('aria-label','Contract: complete '+CONTRACT.map(x=>NAMES[x]).join(', then ')+'.');const nx=CONTRACT.findIndex(x=>!cdone(x));CONTRACT.forEach((x,ix)=>{if(ix)ct.append('→');const d=document.createElement('div');d.className='cc'+(cdone(x)?' done':ix===nx?' next':'');d.style.background=COLORS[x];if(cvd!=='off')d.style.backgroundImage=TEX[x];d.textContent=SYM[x];ct.appendChild(d)})}else if(ct)ct.remove()}
function ftueSetup(){almostShown=false;CHEST=0;ghostSetup();PQ3='';TUT=null;document.body.setAttribute('data-ph',level<3?'a':level<4?'b':'c');document.body.classList.toggle('early',maxLv<5);
  document.body.classList.toggle('flipok',!daily&&(level>=801||!!PRACTICE));if(fogLevel(level)&&!localStorage.getItem('pf_fog')){toast('🌫 Fog: only the top card of each jar is visible. Use Flip!');try{localStorage.setItem('pf_fog','1')}catch(e){}}
  if(CONTRACT.length&&!localStorage.getItem('pf_ct')){toast('📜 Contract: complete the colours in the order shown.');try{localStorage.setItem('pf_ct','1')}catch(e){}}
  PSC=LOCKS.filter(l=>sealedNow(l.j)).length;if(daily)return;
  if(LOCKS.length&&!localStorage.getItem('pf_lock')){toast('🔒 A sealed jar opens when the colour on its lock is completed elsewhere.');try{localStorage.setItem('pf_lock','1')}catch(e){}}
  if(level===1){const sv=solveBoard(jars,200,LOCKS,CONTRACT);if(sv&&sv.path.length){TUT={m:sv.path[0]};hintPair=[TUT.m[0],TUT.m[1]];render()}}
  else if(level===3)toast('Empty jars are your tool: park cards there.');
  else if(level===4)toast('New: a clock. Finish fast for a bonus.');
  else if(level===5)toast('🗺️ The map and daily puzzle are now unlocked!')}
const _tap=tap;
tap=function(i){if(TUT){const m=TUT.m;if((sel===-1&&i!==m[0])||(sel!==-1&&i!==m[1]&&i!==sel)){toast('Follow the glow ✨');return}}
  if(FLIPMODE){FLIPMODE=false;$('flip').classList.remove('on');const j=jars[i];if(j&&j.length>=2&&j[j.length-2]>=100&&coins>=15){j[j.length-2]%=100;coins-=15;save();render();tone(988,.12,'sine');buzz(15);toast('Revealed: '+NAMES[j[j.length-2]])}else toast('Nothing hidden under that card. No charge.');return}
  if(sel!==-1&&i!==sel&&canBase(sel,i)){const m=contractMsg(sel,i);if(m){toast(m);buzz(20);return}}
  NEARCHK=true;_tap(i);NEARCHK=false;
  if(TUT&&moves>=1){TUT=null;hintPair=null;toast('Tap a jar, then tap another to move the top cards.');render()}
  if(!won&&jars.length){const r=solveBoard(jars,20,LOCKS,CONTRACT);if(r&&r.par>0&&r.par<=2&&!almostShown){almostShown=true;toast('✨ Almost there: '+r.par+' move'+(r.par>1?'s':'')+' left')}}};

function practice(L){PRACTICE={L,level,maxLv,coins,totalStars,xp,streak,lastDay,dailies,bests:JSON.stringify(bests),lst:JSON.stringify(lst)};daily=false;level=L;coins=Math.max(coins,100);$('set').classList.remove('on');closeMap();start()}
function endPractice(){const P=PRACTICE;level=P.level;maxLv=P.maxLv;coins=P.coins;totalStars=P.totalStars;xp=P.xp;streak=P.streak;lastDay=P.lastDay;dailies=P.dailies;bests=JSON.parse(P.bests);lst=JSON.parse(P.lst);PRACTICE=null;save()}
const _sv8=save;save=function(){if(PRACTICE)return;_sv8()};
const _win7=win;win=function(){const P=PRACTICE;_win7();if(P){endPractice();PRACTICE=P;$('wmsg').textContent+=' · Practice: progress not counted'}};
const _nx7=$('next').onclick;$('next').onclick=()=>{if(PRACTICE){endPractice();start()}else _nx7()};
$('flip').onclick=()=>{if(won||!(level>=801||PRACTICE))return;if(coins<15)return toast('Flip costs 15 coins');FLIPMODE=!FLIPMODE;$('flip').classList.toggle('on',FLIPMODE);toast(FLIPMODE?'Tap a jar to peek under its top card':'Flip cancelled')};
$('lvl').onclick=()=>{if(maxLv>=5)openMap();else toast('The map opens at level 5. Keep going!')};

/* ===== v10: shop, ghost race, jackpot, adaptive difficulty, challenge links, combo chest ===== */
const SKINS=[['jar','glass','Glass',0],['jar','crystal','Crystal',150],['jar','frosted','Frosted',200],['jar','neon','Neon',300],['fin','glossy','Glossy',0],['fin','matte','Matte',100],['fin','foil','Foil',250],['fin','candy','Candy',200]];
let OWN,EQ;try{OWN=JSON.parse(localStorage.getItem('pf_own')||'["glass","glossy"]');EQ=JSON.parse(localStorage.getItem('pf_eq')||'{"jar":"glass","fin":"glossy"}')}catch(e){OWN=['glass','glossy'];EQ={jar:'glass',fin:'glossy'}}
function applySkin(){const b=document.body;[...b.classList].filter(c=>/^(sk|fin)-/.test(c)).forEach(c=>b.classList.remove(c));b.classList.add('sk-'+EQ.jar,'fin-'+EQ.fin)}applySkin();
function openShop(){let m=$('shop');if(!m){m=document.createElement('div');m.id='shop';m.onclick=e=>{if(e.target===m)m.classList.remove('on')};document.body.appendChild(m)}
  const rows=k=>SKINS.filter(s=>s[0]===k).map(([t,id,nm,pr])=>{const own=OWN.includes(id),eq=EQ[t]===id;return '<div class="si"><div class="sp '+(t==='jar'?'sk-':'fin-')+id+'"><div class="jar"><div class="layer" style="background:'+COLORS[0]+'"></div><div class="layer" style="background:'+COLORS[5]+'"></div></div></div><b>'+nm+'</b><button data-id="'+id+'" data-t="'+t+'">'+(eq?'Equipped':own?'Equip':'🪙 '+pr)+'</button></div>'}).join('');
  m.innerHTML='<div class="mc"><h2>🛍 Shop</h2><p class="rp">🪙 '+coins+'</p><h3>Jar style</h3><div class="sg2">'+rows('jar')+'</div><h3>Card finish</h3><div class="sg2">'+rows('fin')+'</div><button class="gh" id="shx">Close</button></div>';
  m.querySelectorAll('.si button').forEach(b=>b.onclick=()=>{const id=b.dataset.id,t=b.dataset.t,it=SKINS.find(s=>s[1]===id);if(!OWN.includes(id)){if(coins<it[3])return toast('Not enough coins');coins-=it[3];OWN.push(id);tone(880,.1,'sine');tone(1320,.12,'sine',.1)}EQ[t]=id;try{localStorage.setItem('pf_own',JSON.stringify(OWN));localStorage.setItem('pf_eq',JSON.stringify(EQ))}catch(e){}save();applySkin();render();openShop()});
  $('shx').onclick=()=>m.classList.remove('on');m.classList.add('on')}
$('mshop').onclick=openShop;
/* ghost race: your best run on each level */
let GREC=[],GT0=Date.now(),GH=null,CHEST=0,CHAL=null;
function ghostSetup(){GREC=[];GT0=Date.now();GH=null;const o=$('ghl');if(o)o.remove();if(daily||PRACTICE)return;try{GH=JSON.parse(localStorage.getItem('pf_g'+level)||'null')}catch(e){}if(GH){const g=document.createElement('div');g.id='ghl';$('cmb').before(g);ghostTick()}}
function ghostTick(){const g=$('ghl');if(!g||!GH||won)return;const el=Date.now()-GT0,d=Math.min(GH.n,GH.ts.filter(t=>t<=el).length);g.textContent='👻 Ghost '+d+'/'+GH.n+'  ·  You '+moves+'/'+GH.n}
setInterval(ghostTick,500);
/* jackpot, adaptive difficulty */
if(!localStorage.getItem('pf_jk'))try{localStorage.setItem('pf_jk',dayIdx())}catch(e){}
const jkPool=()=>Math.min(1000,100+50*Math.max(0,dayIdx()-(+localStorage.getItem('pf_jk')||dayIdx())-1));
const plainTier=L=>Math.max(0,Math.min(9,pjTierFor(L)+(+localStorage.getItem('pf_dda')||0)));
const _tap10=tap;
tap=function(i){const m0=moves,s0=sel;_tap10(i);if(moves>m0&&s0!==-1&&s0!==i)GREC.push([s0,i,Date.now()-GT0]);
  if(combo>0&&combo%5===0&&combo!==CHEST&&Math.random()<.35){CHEST=combo;coins+=10;save();render();toast('🎁 Combo chest +10 coins');tone(1200,.15,'sine')}};
const _win10=win;
win=function(){const wasD=daily,d0=lastDay,tot=Date.now()-GT0,P=PRACTICE,fast=tLeft/tTot>.4,pool=jkPool(),mv=moves,pr=par,lv=level,G=GH,rec=GREC.slice();_win10();
  if(!wasD&&!P){try{if(!G||tot<G.t)localStorage.setItem('pf_g'+lv,JSON.stringify({m:rec.map(x=>[x[0],x[1]]),ts:rec.map(x=>x[2]),t:tot,n:mv}))}catch(e){}
    if(G&&tot<G.t)$('wmsg').textContent+=' · 👻 Ghost beaten by '+((G.t-tot)/1000).toFixed(1)+'s';
    if(!lockedLevel(lv)&&!contractLevel(lv)&&!fogLevel(lv)){let H=[];try{H=JSON.parse(localStorage.getItem('pf_dh')||'[]')}catch(e){}H.push(mv/Math.max(1,pr));H=H.slice(-3);let dd=+(localStorage.getItem('pf_dda')||0);
      if(H.length===3){if(H.every(r=>r>2)){dd=Math.max(-1,dd-1);H=[]}else if(H.every(r=>r<1.2)){dd=Math.min(1,dd+1);H=[]}}try{localStorage.setItem('pf_dh',JSON.stringify(H));localStorage.setItem('pf_dda',dd)}catch(e){}}}
  if(wasD&&lastDay!==d0&&fast&&!P){coins+=pool;try{localStorage.setItem('pf_jk',dayIdx())}catch(e){}save();render();$('wmsg').textContent+=' · 💰 Jackpot +'+pool}
  if(CHAL&&P&&P.L===CHAL.L)$('wmsg').textContent+=mv<=CHAL.t?' · ⚔ You beat the challenge!':' · ⚔ Challenge was '+CHAL.t+' moves'};
function shareChallenge(){const u=location.href.split('#')[0],url=u+'#ch='+level+'.'+moves,txt='I cleared Pourfect level '+level+' in '+moves+' moves. Beat me!';
  if(!/^https:/.test(location.protocol)||/localhost|127\.|192\.168\.|^10\.|claude/i.test(location.hostname)){toast('Put the game online first so friends can open the link');return}
  if(navigator.share)navigator.share({title:'Pourfect challenge',text:txt,url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt+' '+url).then(()=>toast('Challenge copied'))}
{const a=document.createElement('button');a.className='opt';a.id='chal';a.textContent='⚔ Challenge a friend';a.onclick=shareChallenge;const d=document.createElement('button');d.className='opt';d.id='duow';d.textContent='🤝 Play with a friend';d.onclick=mpModal;$('shareWin').after(a,d)}
{const m=location.hash.match(/#ch=(\d+)\.(\d+)/);if(m){CHAL={L:+m[1],t:+m[2]};setTimeout(()=>{toast('⚔ Challenge: beat '+CHAL.t+' moves on level '+CHAL.L);practice(CHAL.L)},500)}}

if(maxLv>=5)openMap();


start();
</script>
