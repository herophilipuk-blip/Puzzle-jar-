<style>
:root{--bg1:#d9ecff;--bg2:#bff2e8;--fg:#15324d;--glass:rgba(255,255,255,.55);--edge:rgba(21,50,77,.5);--btn:rgba(21,50,77,.1);--card:#fff;--accent:#d9480f;--cols:5;--jw:clamp(40px,calc((min(100vw,520px) - 32px - (var(--cols) - 1)*12px) / var(--cols)),76px);--lh:calc(var(--jw)*.6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg1:#1a2556;--bg2:#0e6f7e;--fg:#f4f8ff;--glass:rgba(255,255,255,.13);--edge:rgba(255,255,255,.55);--btn:rgba(255,255,255,.15);--card:#22306a;--accent:#ffd93d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;color:var(--fg);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1);display:flex;flex-direction:column;align-items:center;user-select:none;overflow-x:hidden}
header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
h1{font-size:19px;font-weight:800;margin:0;white-space:nowrap}
.meta{display:flex;gap:10px;align-items:center;font-weight:800}
.chip{background:var(--btn);border-radius:999px;padding:7px 12px;font-size:15px;white-space:nowrap}
.icon{background:var(--btn);border:0;color:var(--fg);border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer}
.icon[aria-pressed="true"]{outline:2px solid var(--accent)}

#board{display:grid;grid-template-columns:repeat(var(--cols),var(--jw));justify-content:center;gap:30px 12px;padding:26px 4px 10px}
.jar{width:var(--jw);height:calc(var(--lh)*4 + 18px);border:3px solid var(--edge);border-top:0;border-radius:4px 4px 24px 24px;background:var(--glass);display:flex;flex-direction:column-reverse;gap:2px;padding:4px 3px;cursor:pointer;transition:transform .18s ease,box-shadow .2s}
.jar.sel{transform:translateY(-16px)}
.jar.hint{box-shadow:0 0 0 3px var(--accent)}
.jar.done{box-shadow:0 0 14px 2px rgba(255,255,255,.7)}
.layer{height:var(--lh);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:rgba(0,0,0,.5)}
.layer.new{animation:pop .3s ease-out}
@keyframes pop{from{transform:scaleY(.2);opacity:.3}to{transform:none;opacity:1}}
#bar{display:flex;gap:8px;justify-content:center;padding:10px 12px 18px}
#bar button{flex:1;max-width:100px;border:0;border-radius:18px;padding:8px 4px;background:var(--btn);color:var(--fg);font:800 13px 'Nunito',system-ui,sans-serif;cursor:pointer;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap;position:relative}#bar i{font-style:normal;font-size:22px;line-height:1}.badge{position:absolute;top:5px;right:9px;min-width:18px;height:18px;border-radius:9px;background:#ff5a5f;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
#bar button:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86vw}
#toast.on{opacity:1}
#win,#set,#lb,#pick{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
#win.on,#set.on,#lb.on,#pick.on{display:flex}
.card{background:var(--card);color:var(--fg);border-radius:26px;padding:26px 22px;text-align:center;width:min(340px,100%)}
.card h2{margin:0 0 4px;font-size:26px;font-weight:800}

.card p{margin:4px 0 16px}.opt{display:block;width:100%;margin:0 0 10px;background:var(--btn)!important;color:var(--fg)!important;font-size:15px!important}.opt[aria-pressed="true"]{outline:2px solid var(--accent)}
.card button{border:0;border-radius:16px;background:var(--accent);color:#fff;font:800 17px 'Nunito',system-ui,sans-serif;padding:14px 26px;cursor:pointer;min-height:48px}
:root:not([data-theme="light"]) .card button{color:#12203a}
@media (prefers-reduced-motion:reduce){.layer.new{animation:none}.jar{transition:none}}
:root{--sq:clamp(62px,19vw,80px)}header{justify-content:center}h1{display:none}#lvl{cursor:pointer}#bar{gap:12px;padding:12px 12px 20px}#bar button{flex:none;width:var(--sq);height:var(--sq);min-height:0;max-width:none;padding:0;border-radius:20px;color:#fff;font-size:12px;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s,filter .2s}#bar i{font-size:26px}#bar button:active:not(:disabled){transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35)}#undo{background:linear-gradient(160deg,#6db3ff,#3b6fe0)!important}#extra{background:linear-gradient(160deg,#6be08a,#1f9d55)!important}#hint{background:linear-gradient(160deg,#ffd666,#f59f00)!important}#restart{background:linear-gradient(160deg,#ff8a8a,#e03e5a)!important}#bar button:disabled{filter:grayscale(.8) brightness(.8);box-shadow:0 2px 0 rgba(0,0,0,.2);opacity:.6}.pulse{animation:pls 1s ease-in-out infinite}@keyframes pls{50%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.28)}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}#lbl{list-style:none;margin:8px 0 14px;padding:0;max-height:42vh;overflow:auto;text-align:left}#lbl li{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--btn);font-weight:800}#lbl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lbl .me{outline:2px solid var(--accent);border-radius:8px}#lbmsg{min-height:18px;font-size:14px;margin:6px 0}#cty{width:100%;padding:11px;border-radius:12px;border:0;background:var(--btn);color:var(--fg);font:800 15px 'Nunito',system-ui,sans-serif}#cty option{color:#111}#pk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:50vh;overflow:auto;margin:10px 0}#pk button{padding:12px 0;font-size:15px!important;border-radius:12px!important;background:var(--btn)!important;color:var(--fg)!important}#pk button.cur{outline:2px solid var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Pourfect</h1>
  <div class="meta">
    <span class="chip" id="lvl">Level 1</span>
    <span class="chip" id="coins">ðŸª™ 0</span>
    <button class="icon" id="trophy" aria-label="Leaderboard">ðŸ†</button><button class="icon" id="gear" aria-label="Settings">âš™</button>
    
  </div>
</header>
<main><div id="board"></div></main>
<div id="bar">
  <button id="undo"><i>â†¶</i>Undo</button>
  <button id="extra"><i>ï¼‹</i>Jar</button>
  <button id="hint"><i>ðŸ’¡</i>Hint<b class="badge" id="hb">3</b></button>
  <button id="restart"><i>âŸ³</i>Restart</button>
</div>
<div id="toast"></div>
<div id="set"><div class="card"><h2>Settings</h2><button class="opt" id="snd"></button><button class="opt" id="cbm"></button><button class="opt" id="sng"></button><button class="opt" id="thm"></button><button id="closeSet">Done</button></div></div>
<div id="lb"><div class="card"><h2>Leaderboard</h2><select id="cty" aria-label="Your country"></select><div id="lbmsg"></div><ol id="lbl"></ol><button id="closeLb">Done</button></div></div>
<div id="pick"><div class="card"><h2>Pick a level</h2><div id="pk"></div><button id="closePk">Close</button></div></div>
<div id="win"><div class="card"><h2>Level complete</h2><div id="stars">â˜…â˜…â˜…</div><p id="wmsg"></p><button id="next">Next level</button></div></div>
<script>
const COLORS=['#FF5A5F','#FF9F1C','#FFD93D','#7BD63F','#1FC7B6','#3FA9F5','#4F5BD5','#9B5DE5','#F15BB5','#A47148','#E8EEF2','#7A1F4B'];
const SYM=['â—','â–²','â˜…','â– ','â—†','â™¥','âœš','â¬Ÿ','â˜¾','âœ–','â¬¢','â™¦'];
const CAP=4;
let level=1,coins=0,sound=true,cb=false,single=false,maxLv=1,theme=0,owned=[0],country='',totalStars=0;
let jars=[],sel=-1,hist=[],moves=0,combo=0,extraUsed=false,hints=3,won=false,lastPour=null,hintPair=null,par=0;
try{level=+localStorage.getItem('pf_level')||1;coins=+localStorage.getItem('pf_coins')||0;cb=localStorage.getItem('pf_cb')==='1';single=localStorage.getItem('pf_single')==='1';maxLv=+localStorage.getItem('pf_max')||level;theme=+localStorage.getItem('pf_theme')||0;totalStars=+localStorage.getItem('pf_stars')||0;country=localStorage.getItem('pf_cty')||((navigator.language||'').split('-')[1]||'').toUpperCase();owned=JSON.parse(localStorage.getItem('pf_owned')||'[0]');sound=localStorage.getItem('pf_snd')!=='0'}catch(e){}
function save(){try{localStorage.setItem('pf_level',level);localStorage.setItem('pf_coins',coins);localStorage.setItem('pf_cb',cb?'1':'0');localStorage.setItem('pf_single',single?'1':'0');localStorage.setItem('pf_max',maxLv);localStorage.setItem('pf_theme',theme);localStorage.setItem('pf_stars',totalStars);localStorage.setItem('pf_cty',country);localStorage.setItem('pf_owned',JSON.stringify(owned));localStorage.setItem('pf_snd',sound?'1':'0')}catch(e){}}
const $=id=>document.getElementById(id);

/* audio */
let ac=null;
function tone(f,d,type,delay,slideTo){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

/* logic */
let rnd=Math.random;function mul(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solvable(s){const seen=new Set();let nodes=0;const key=x=>x.map(j=>j.join(',')).sort().join('|');function dfs(x){if(x.every(j=>j.length===0||(j.length===CAP&&j.every(v=>v===j[0]))))return true;if(++nodes>20000)return false;const k=key(x);if(seen.has(k))return false;seen.add(k);for(let a=0;a<x.length;a++){const A=x[a];if(!A.length)continue;const c=A[A.length-1];let m=1;while(m<A.length&&A[A.length-1-m]===c)m++;const uni=m===A.length;for(let b=0;b<x.length;b++){if(a===b)continue;const B=x[b];if(B.length>=CAP||(B.length&&B[B.length-1]!==c))continue;if(uni&&!B.length)continue;const n=single?1:Math.min(m,CAP-B.length);const y=x.map(j=>j.slice());for(let i=0;i<n;i++){y[a].pop();y[b].push(c)}if(dfs(y))return true}}return false}return dfs(s)}
const uniform=j=>j.length>0&&j.every(x=>x%100===j[0]%100);
const full=j=>j.length===CAP&&uniform(j);
function gen(){
  rnd=mul(level*7919+13);const n=Math.min(12,2+Math.floor((level-1)/3));
  const pool=[];for(let c=0;c<n;c++)for(let i=0;i<CAP;i++)pool.push(c);
  let tries=0;
  do{shuffle(pool);jars=[];for(let j=0;j<n;j++)jars.push(pool.slice(j*CAP,j*CAP+CAP));jars.push([],[]);tries++}
  while((jars.some(full)||!solvable(jars))&&tries<40);
  par=n*3;if(level>=15){const p=Math.min(.55,(level-12)*.04);jars.forEach(j=>{for(let k=0;k<j.length-1;k++)if(rnd()<p)j[k]+=100})}
}
function chunk(j){let k=1;while(k<j.length&&j[j.length-1-k]===j[j.length-1])k++;return k}
function can(a,b){if(a===b)return false;const A=jars[a],B=jars[b];if(!A.length||B.length>=CAP)return false;return !B.length||B[B.length-1]===A[A.length-1]}
function anyMove(){for(let a=0;a<jars.length;a++)for(let b=0;b<jars.length;b++)if(can(a,b))return true;return false}
function isWon(){return jars.every(j=>j.length===0||full(j))}
function snap(){hist.push({jars:JSON.stringify(jars),moves,extraUsed})}

function pour(a,b){
  snap();
  const A=jars[a],B=jars[b];
  const n=single?1:Math.min(chunk(A),CAP-B.length),c=A[A.length-1];
  for(let i=0;i<n;i++){A.pop();B.push(c)}if(A.length&&A[A.length-1]>=100)A[A.length-1]-=100;if(full(B))B.forEach((x,i)=>{B[i]=x%100});
  moves++;combo++;
  lastPour={to:b,n};hintPair=null;
  tone(300+Math.min(combo,8)*45,.22,'sine',0,180+Math.min(combo,8)*30);
  if(full(B)){tone(660,.25,'triangle',.12);tone(880,.3,'triangle',.24);buzz(30)}else buzz(8);
}

/* render */
function render(){
  const bd=$('board');bd.innerHTML='';document.documentElement.style.setProperty('--cols',jars.length<=5?jars.length:Math.ceil(jars.length/2));
  jars.forEach((j,i)=>{
    const d=document.createElement('div');
    d.className='jar'+(i===sel?' sel':'')+(hintPair&&(hintPair[0]===i||hintPair[1]===i)?' hint':'')+(full(j)?' done':'');
    d.setAttribute('role','button');d.setAttribute('aria-label','Jar '+(i+1));
    j.forEach((c,k)=>{
      const l=document.createElement('div');
      l.className='layer'+(lastPour&&lastPour.to===i&&k>=j.length-lastPour.n?' new':'');
      l.style.background=c>=100?'#6b7a99':COLORS[c%100];
      l.textContent=c>=100?'?':(cb?SYM[c]:'');
      d.appendChild(l);
    });
    d.onclick=()=>tap(i);
    bd.appendChild(d);
  });
  lastPour=null;
  $('lvl').textContent='Lv '+level+' â–¾';
  $('coins').textContent='ðŸª™ '+coins;
  $('hb').textContent=hints;$('extra').classList.toggle('pulse',!won&&!extraUsed&&!anyMove());
  $('hint').disabled=hints<=0;
  $('extra').disabled=extraUsed;
  $('undo').disabled=!hist.length;
  $('snd').textContent='Sound: '+(sound?'On':'Off');$('snd').setAttribute('aria-pressed',sound);
  $('cbm').textContent='Symbols on colors: '+(cb?'On':'Off');$('cbm').setAttribute('aria-pressed',cb);$('sng').textContent='Pour one layer at a time: '+(single?'On':'Off');$('sng').setAttribute('aria-pressed',single);$('thm').textContent='Theme: '+THEMES[theme].n+(owned.includes(theme)?'':' ðŸ”’ '+THEMES[theme].cost+' ðŸª™')+(thmMsg?' ('+thmMsg+')':'');
}

function tap(i){
  if(won)return;
  if(ac&&ac.state==='suspended')ac.resume();
  if(sel===-1){
    if(jars[i].length&&!full(jars[i])){sel=i;tone(520,.08,'sine');render()}
    return;
  }
  if(sel===i){sel=-1;render();return}
  if(can(sel,i)){
    const from=sel;sel=-1;pour(from,i);render();
    if(isWon())return setTimeout(win,420);
    if(!anyMove())toast('No moves left. Try Undo or ï¼‹ Jar.');
  }else{
    tone(150,.12,'square');buzz(15);
    if(jars[i].length&&!full(jars[i]))sel=i;else sel=-1;
    combo=0;render();
  }
}

function win(){
  won=true;
  const stars=moves<=par?3:moves<=par*1.5?2:1;
  const reward=10+Math.min(20,level)+(stars===3?10:0);
  coins+=reward;totalStars+=stars;if(level>=maxLv)maxLv=level+1;save();post();
  $('stars').textContent='â˜…'.repeat(stars)+'â˜†'.repeat(3-stars);
  $('wmsg').textContent=moves+' moves Â· +'+reward+' coins';
  [523,659,784,1047].forEach((f,k)=>tone(f,.28,'triangle',k*.11));buzz(60);
  $('win').classList.add('on');render();
}

function start(){
  gen();sel=-1;hist=[];moves=0;combo=0;extraUsed=false;hints=3;won=false;hintPair=null;
  $('win').classList.remove('on');applyTheme();render();if(level===15)toast('New: ? layers show their color when they reach the top');
}

/* controls */
$('undo').onclick=()=>{
  if(!hist.length||won)return;
  const s=hist.pop();jars=JSON.parse(s.jars);moves=s.moves;extraUsed=s.extraUsed;sel=-1;combo=0;hintPair=null;tone(240,.12,'sine');render();
};
$('extra').onclick=()=>{
  if(extraUsed||won)return;
  snap();jars.push([]);extraUsed=true;tone(420,.15,'triangle');render();
};
$('hint').onclick=()=>{
  if(hints<=0||won)return;
  let best=null;
  for(let a=0;a<jars.length;a++)for(let b=0;b<jars.length;b++){
    if(!can(a,b))continue;
    const A=jars[a],B=jars[b];
    if(uniform(A)&&!B.length)continue;
    const score=(B.length?2:0)+(uniform(A)?1:0)+chunk(A)*.1;
    if(!best||score>best.s)best={a,b,s:score};
  }
  if(!best){toast('No helpful move. Try Undo or ï¼‹ Jar.');return}
  hints--;hintPair=[best.a,best.b];sel=-1;tone(700,.12,'sine');render();
};
$('restart').onclick=()=>{start()};
$('next').onclick=()=>{level++;save();start()};
$('snd').onclick=()=>{sound=!sound;save();render()};
$('cbm').onclick=()=>{cb=!cb;save();render()};$('sng').onclick=()=>{single=!single;save();render()};$('gear').onclick=()=>$('set').classList.add('on');$('closeSet').onclick=()=>$('set').classList.remove('on');
const THEMES=[{n:'Auto'},{n:'Sunset',cost:100,a:'#3b1c5a',b:'#d9576b'},{n:'Forest',cost:150,a:'#0b3d2e',b:'#2f8f5b'},{n:'Midnight',cost:200,a:'#05060f',b:'#1c2a5a'}];let thmMsg='';
function applyTheme(){const r=document.documentElement.style,t=THEMES[theme]||THEMES[0];['--bg1','--bg2','--fg','--glass','--edge','--btn','--card','--accent'].forEach(k=>r.removeProperty(k));if(!t.a||!owned.includes(theme))return;r.setProperty('--bg1',t.a);r.setProperty('--bg2',t.b);r.setProperty('--fg','#fff');r.setProperty('--glass','rgba(255,255,255,.13)');r.setProperty('--edge','rgba(255,255,255,.55)');r.setProperty('--btn','rgba(255,255,255,.15)');r.setProperty('--card','#22306a');r.setProperty('--accent','#ffd93d')}
$('thm').onclick=()=>{theme=(theme+1)%THEMES.length;const t=THEMES[theme];thmMsg='';if(t.cost&&!owned.includes(theme)){if(coins>=t.cost){coins-=t.cost;owned.push(theme)}else thmMsg='need '+t.cost+' coins'}save();applyTheme();render()};
function openPick(){const pk=$('pk');pk.innerHTML='';for(let i=1;i<=maxLv;i++){const b=document.createElement('button');b.textContent=i;if(i===level)b.className='cur';b.onclick=()=>{level=i;save();$('pick').classList.remove('on');start()};pk.appendChild(b)}$('pick').classList.add('on')}
$('lvl').onclick=openPick;$('closePk').onclick=()=>$('pick').classList.remove('on');
const CTY={US:'United States',GB:'United Kingdom',NG:'Nigeria',GH:'Ghana',KE:'Kenya',ZA:'South Africa',EG:'Egypt',IN:'India',PK:'Pakistan',BD:'Bangladesh',PH:'Philippines',ID:'Indonesia',BR:'Brazil',MX:'Mexico',CA:'Canada',DE:'Germany',FR:'France',ES:'Spain',IT:'Italy',TR:'Turkey',SA:'Saudi Arabia',AE:'UAE',CN:'China',JP:'Japan',KR:'South Korea',AU:'Australia',RU:'Russia',UA:'Ukraine',PL:'Poland',NL:'Netherlands'};
const flag=c=>/^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'ðŸŒ';
let DB=null,USER=null,MYID=null,unsub=null;
(async()=>{try{if(!window.claude||!claude.use)return;DB=await claude.use('db');USER=await claude.use('user');MYID=USER?await USER.id():null}catch(e){}})();
async function post(){if(!DB||!MYID)return;try{await DB.doc('leaderboard/'+MYID).set({level:Math.max(0,maxLv-1),score:Math.max(0,maxLv-1)*1000+Math.min(999,totalStars),country:country||'',t:Date.now()})}catch(e){}}
function openLb(){$('lb').classList.add('on');const m=$('lbmsg'),s=$('cty');if(!s.options.length)s.innerHTML='<option value="">Choose your country</option>'+Object.entries(CTY).map(([k,v])=>`<option value="${k}">${flag(k)} ${v}</option>`).join('');s.value=country;
if(!DB||!MYID){m.textContent='The leaderboard needs the claude.ai viewer with a signed-in account.';$('lbl').innerHTML='';return}
m.textContent='Loadingâ€¦';post();if(unsub){try{unsub()}catch(e){}}
try{unsub=DB.collection('leaderboard').onSnapshot(async snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.score-a.score).slice(0,20);let ps={};try{ps=await USER.profiles(rows.map(r=>r.id))}catch(e){}const ol=$('lbl');ol.innerHTML='';m.textContent=rows.length?'':'No scores yet. Win a level to post yours.';rows.forEach((r,i)=>{const li=document.createElement('li');if(r.id===MYID)li.className='me';const rk=document.createElement('span'),fl=document.createElement('span'),nm=document.createElement('span'),sc=document.createElement('span');rk.textContent=(i+1)+'.';fl.textContent=flag(r.country);nm.className='nm';nm.textContent=(ps[r.id]&&ps[r.id].name)||'Player';sc.textContent='Lv '+r.level;li.append(rk,fl,nm,sc);ol.appendChild(li)})},e=>{m.textContent='Could not load scores.'})}catch(e){m.textContent='Could not load scores.'}}
$('trophy').onclick=openLb;$('closeLb').onclick=()=>{$('lb').classList.remove('on');if(unsub){try{unsub()}catch(e){}unsub=null}};$('cty').onchange=()=>{country=$('cty').value;save();post()};

start();
</script>
</body>
</html>
