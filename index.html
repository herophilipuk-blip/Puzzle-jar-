const CAP=4;
let level=1,coins=0,sound=true,cb=false,single=false,maxLv=1,theme=0,owned=[0],country='',totalStars=0,xp=0,streak=0,lastDay=-1,dailies=0,daily=false,music=true,bests={},lst={},nick='',enter=false,limit=0;

try{level=+localStorage.getItem('pf_level')||1;coins=+localStorage.getItem('pf_coins')||0;cb=localStorage.getItem('pf_cb')==='1';single=localStorage.getItem('pf_single')==='1';maxLv=+localStorage.getItem('pf_max')||level;theme=+localStorage.getItem('pf_theme')||0;totalStars=+localStorage.getItem('pf_stars')||0;country=localStorage.getItem('pf_cty')||((navigator.language||'').split('-')[1]||'').toUpperCase();owned=JSON.parse(localStorage.getItem('pf_owned')||'[0]');sound=localStorage.getItem('pf_snd')!=='0';xp=+localStorage.getItem('pf_xp')||0;streak=+localStorage.getItem('pf_streak')||0;lastDay=+(localStorage.getItem('pf_last')||-1);dailies=+localStorage.getItem('pf_dn')||0;music=localStorage.getItem('pf_mus')!=='0';bests=JSON.parse(localStorage.getItem('pf_best')||'{}');nick=localStorage.getItem('pf_nick')||'';lst=JSON.parse(localStorage.getItem('pf_lst')||'{}')}catch(e){}
function save(){try{localStorage.setItem('pf_level',level);localStorage.setItem('pf_coins',coins);localStorage.setItem('pf_cb',cb?'1':'0');localStorage.setItem('pf_single',single?'1':'0');localStorage.setItem('pf_max',maxLv);localStorage.setItem('pf_theme',theme);localStorage.setItem('pf_stars',totalStars);localStorage.setItem('pf_cty',country);localStorage.setItem('pf_owned',JSON.stringify(owned));localStorage.setItem('pf_snd',sound?'1':'0');localStorage.setItem('pf_xp',xp);localStorage.setItem('pf_streak',streak);localStorage.setItem('pf_last',lastDay);localStorage.setItem('pf_dn',dailies);localStorage.setItem('pf_mus',music?'1':'0');localStorage.setItem('pf_best',JSON.stringify(bests));localStorage.setItem('pf_nick',nick);localStorage.setItem('pf_lst',JSON.stringify(lst))}catch(e){}}
function dayIdx(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
const $=id=>document.getElementById(id);

/* audio */
let ac=null;
function tone(f,d,type,delay,slideTo){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(OUT());o.start(t);o.stop(t+d+.02)}catch(e){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

/* logic */
let rnd=Math.random;function mul(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solvable(s){return !!solveBoard(s,60)}
const uniform=j=>j.length>0&&j.every(x=>x%100===j[0]%100);
const full=j=>j.length===CAP&&uniform(j);
function gen(){const L=daily?100000+dayIdx():level,b=(!daily&&contractLevel(L))?contractForLevel(L):(!daily&&lockedLevel(L))?lockedForLevel(L):boardForLevel(L,daily?5:plainTier(L));jars=b.jars;LOCKS=b.locks||[];CONTRACT=b.contract||[];rnd=mul(L*7919+13);let hid=0;
  if(level>=2||daily){const p=(!daily&&fogLevel(L))?1:daily?.3:Math.min(.8,.1+(level-2)*.025+({tense:.08,hard:.15,boss:.15}[moodOf(L)]||0));jars.forEach(j=>{for(let k=0;k<j.length-1;k++)if(rnd()<p){j[k]+=100;hid++}})}

function chunk(j){let k=1;while(k<j.length&&j[j.length-1-k]===j[j.length-1])k++;return k}
function can(a,b){return !sealedNow(a)&&!sealedNow(b)&&canBase(a,b)&&!contractMsg(a,b)}
function canBase(a,b){if(a===b)return false;const A=jars[a],B=jars[b];if(!A.length||B.length>=CAP)return false;return !B.length||B[B.length-1]===A[A.length-1]}
function anyMove(){for(let a=0;a<jars.length;a++)for(let b=0;b<jars.length;b++)if(can(a,b))return true;return false}
function isWon(){return jars.every(j=>j.length===0||full(j))}
function snap(){hist.push({jars:JSON.stringify(jars),moves,extraUsed})}

function pour(a,b){
  snap();
  const A=jars[a],B=jars[b];
  const n=single?1:Math.min(chunk(A),CAP-B.length),c=A[A.length-1];
  for(let i=0;i<n;i++){A.pop();B.push(c)}if(A.length&&A[A.length-1]>=100)A[A.length-1]-=100;if(full(B))B.forEach((x,i)=>{B[i]=x%100});

}

function tap(i){
  if(won)return;
  if(ac&&ac.state==='suspended')ac.resume();
  if(sel===-1){
    if(jars[i].length&&!full(jars[i])){sel=i;tone(520,.08,'sine');render()}
    return;
  }
  if(sel===i){sel=-1;render();return}
  if(can(sel,i)){
    const from=sel;sel=-1;pour(from,i);render();
    if(isWon())return setTimeout(win,420);if(limit&&moves>=limit){toast('Out of moves! Restarting…');return setTimeout(start,1200)}
    if(!anyMove())toast('No moves left. Try Undo or ＋ Jar.');else if(solveBoard(jars,30,LOCKS,CONTRACT)===null)toast('Dead end: undo, or add a ＋ Jar.');
  }else{
    tone(150,.12,'square');buzz(15);
    if(jars[i].length&&!full(jars[i]))sel=i;else sel=-1;
    combo=0;render();
  }
}

function win(){
  won=true;
  const stars=moves<=par?3:moves<=par*1.5?2:1;
  let reward=10+Math.min(20,level)+(stars===3?10:0),extra='';
  let nb=false;if(daily){const d=dayIdx();if(lastDay!==d){streak=(lastDay===d-1)?streak+1:1;lastDay=d;dailies++;reward+=50;extra=' · Daily +50 · 🔥'+streak}else extra=' · Daily already done today'}else{if(!bests[level]||moves<bests[level]){nb=!!bests[level];bests[level]=moves}lst[level]=Math.max(lst[level]||0,stars);if(level>=maxLv)maxLv=level+1;if(level%10===0){reward+=50;extra=' · Chapter complete +50'}}xp+=20+stars*10+(daily?40:0);coins+=reward;totalStars+=stars;save();post();confetti();
  $('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('wmsg').textContent=moves+' moves · +'+reward+' coins'+extra+(nb?' · New best!':'');
  fanfare(stars);buzz(60);
  $('win').classList.add('on');render();
}

function startBase(){
  gen();enter=true;sel=-1;hist=[];moves=0;combo=0;extraUsed=false;hints=3;undosLeft=5;won=false;hintPair=null;
  $('win').classList.remove('on');applyTheme();render();if(limit)toast('Boss level: clear it within '+limit+' moves!');else if(level===2)toast('New: ? layers show their color when they reach the top');
}

/* controls */
$('undo').onclick=()=>{
  if(!hist.length||won||undosLeft<=0){if(undosLeft<=0)toast('No undos left this level');return;}
  const s=hist.pop();jars=JSON.parse(s.jars);moves=s.moves;extraUsed=s.extraUsed;sel=-1;combo=0;hintPair=null;undosLeft--;tone(240,.12,'sine');render();
};
$('extra').onclick=()=>{
  if(extraUsed||won)return;
  snap();jars.push([]);extraUsed=true;tone(420,.15,'triangle');render();
};
$('hint').onclick=()=>{
  if(hints<=0||won)return;
  const sv=solveBoard(jars,80,LOCKS,CONTRACT);if(!sv||!sv.path.length){toast(sv===null?'Dead end. Undo, or add a ＋ Jar.':sv?'Already solved!':'Too complex to read in time. Try Undo.');return}
  const best={a:sv.path[0][0],b:sv.path[0][1]};
  hints--;hintPair=[best.a,best.b];sel=-1;tone(700,.12,'sine');render();

$('restart').onclick=()=>{start()};
$('next').onclick=()=>{if(daily)daily=false;else level++;save();start()};
$('snd').onclick=()=>{sound=!sound;save();render()};
$('cbm').onclick=()=>{cb=!cb;save();render()};$('sng').onclick=()=>{single=!single;save();render()};$('gear').onclick=()=>$('set').classList.add('on');$('closeSet').onclick=()=>$('set').classList.remove('on');
const THEMES=[{n:'Auto'},{n:'Sunset',cost:100,a:'#3b1c5a',b:'#d9576b'},{n:'Forest',cost:150,a:'#0b3d2e',b:'#2f8f5b'},{n:'Midnight',cost:200,a:'#05060f',b:'#1c2a5a'}];let thmMsg='';
function applyTheme(){const r=document.documentElement.style,t=THEMES[theme]||THEMES[0];['--bg1','--bg2','--fg','--glass','--edge','--btn','--card','--accent'].forEach(k=>r.removeProperty(k));if(!t.a||!owned.includes(theme))return;r.setProperty('--bg1',t.a);r.setProperty('--bg2',t.b);r.setProperty('--fg','#fff');r.setProperty('--glass','rgba(255,255,255,.13)');r.setProperty('--edge','rgba(255,255,255,.55)');r.setProperty('--btn','rgba(255,255,255,.15)');r.setProperty('--card','#22306a');r.setProperty('--accent','#ffd93d')}
$('thm').onclick=()=>{theme=(theme+1)%THEMES.length;const t=THEMES[theme];thmMsg='';if(t.cost&&!owned.includes(theme)){if(coins>=t.cost){coins-=t.cost;owned.push(theme)}else thmMsg='need '+t.cost+' coins'}save();applyTheme();render()};
function openPick(){const pk=$('pk');pk.innerHTML='';$('dailyBtn').textContent='📅 Daily Puzzle Jar'+(lastDay===dayIdx()?' ✔':'')+(streak?' · 🔥'+streak:'');for(let i=1;i<=maxLv;i++){const b=document.createElement('button');b.textContent=i;if(i===level)b.className='cur';b.onclick=()=>{daily=false;level=i;save();$('pick').classList.remove('on');start()};pk.appendChild(b)}$('pick').classList.add('on')}
$('lvl').onclick=openMap;$('closePk').onclick=()=>$('pick').classList.remove('on');

let DB=null,USER=null,MYID=null,unsub=null;
(async()=>{try{if(!window.claude||!claude.use)return;DB=await claude.use('db');USER=await claude.use('user');MYID=USER?await USER.id():null}catch(e){}})();

/* music */
const CH=[[220,261.63,329.63],[174.61,220,261.63],[196,261.63,329.63],[196,246.94,293.66]],SC=[523.25,587.33,659.25,783.99,880,1046.5];let mTimer=null,mStep=0,mg=null;
function mnote(f,d,v,type){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function mtick(){if(!music||!ac||document.hidden)return;const bar=Math.floor(mStep/8)%4;if(mStep%8===0)CH[bar].forEach(f=>mnote(f/2,3,.5,'sine'));if(mStep%2===0||Math.random()<.35)mnote(SC[(Math.random()*SC.length)|0],1,.32,'triangle');mStep++}
const BEAT=.78,MEL=[[0,659.25,1],[1,783.99,1],[2,880,1.5],[3.5,783.99,.5],[4,659.25,1.5],[5.5,587.33,.5],[6,523.25,2],[8,440,1],[9,523.25,1],[10,587.33,1.5],[11.5,523.25,.5],[12,587.33,1.5],[13.5,493.88,.5],[14,392,2]],CHD=[[130.81,164.81,196],[110,130.81,164.81],[87.31,110,130.81],[98,123.47,146.83]];
function vnote(f,t,d,v){const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=f*3;lp.Q.value=.6;l.frequency.value=5.4;lg.gain.value=f*.006;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.2);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(.0001,t+d+.3);o.connect(lp);lp.connect(g);g.connect(mg);o.start(t);l.start(t);o.stop(t+d+.35);l.stop(t+d+.35)}

function roomLoop(t0){const m=MD[mood];m.P.forEach((x,k)=>{const t=t0+k*m.tp;if(x>=0)rnote(m.S[x],t,m);if(k%4===0){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=m.B[(k/4)%m.B.length|0];g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+m.tp*3.6);o.connect(g);g.connect(mg);o.start(t);o.stop(t+m.tp*4);if(m.dr){const d=ac.createOscillator(),e=ac.createGain();d.frequency.setValueAtTime(140,t);d.frequency.exponentialRampToValueAtTime(40,t+.15);e.gain.setValueAtTime(.5,t);e.gain.exponentialRampToValueAtTime(.0001,t+.2);d.connect(e);e.connect(mg);d.start(t);d.stop(t+.25)}}});return m.P.length*m.tp}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function wrap(g,t,mw){const w=String(t).split(' '),L=[];let c='';w.forEach(x=>{const n=c?c+' '+x:x;if(g.measureText(n).width>mw&&c){L.push(c);c=x}else c=n});if(c)L.push(c);return L}
async function makeCard(o){try{await document.fonts.load('900 60px Nunito')}catch(e){}
 const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d'),F='Nunito,system-ui,sans-serif';

 g.fillStyle='#14224f';g.font='900 86px '+F;const hl=wrap(g,o.head,W-240).slice(0,3);hl.forEach((l,i)=>g.fillText(l,W/2,360+i*98));
 g.font='800 38px '+F;g.fillStyle='#5a6485';wrap(g,o.sub||'',W-240).slice(0,2).forEach((l,i)=>g.fillText(l,W/2,360+hl.length*98+20+i*50));
 const st=(o.stats||[]).slice(0,3),pw=(W-140-80-(st.length-1)*20)/Math.max(1,st.length);st.forEach(([ic,lb,v],i)=>{const x=110+i*(pw+20),y=700;g.fillStyle='#FFF1CC';rr(g,x,y,pw,130,30);g.fill();g.fillStyle='#14224f';g.font='900 52px '+F;g.fillText(ic+' '+v,x+pw/2,y+62);g.font='800 26px '+F;g.fillStyle='#8a6a1f';g.fillText(lb,x+pw/2,y+106)});
 const cols=[0,3,5,7,8,1],jw=110,gap=30,tw=cols.length*jw+(cols.length-1)*gap;cols.forEach((c,i)=>{const x=(W-tw)/2+i*(jw+gap),y=940,h=190;g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=8;rr(g,x,y,jw,h,26);g.fillStyle='rgba(255,255,255,.28)';g.fill();g.stroke();for(let k=0;k<4;k++){g.fillStyle=COLORS[(c+(k>2?1:0))%12];rr(g,x+10,y+h-18-(k+1)*40+4,jw-20,34,12);g.fill()}});
 g.fillStyle='#14224f';rr(g,150,1180,W-300,96,48);g.fill();g.fillStyle='#FFD93D';g.font='900 44px '+F;g.fillText(o.cta||'Beat me!  ▶',W/2,1244);
 g.fillStyle='#14224f';g.font='800 28px '+F;g.fillText((o.name?o.name+'  ·  ':'')+location.host,W/2,1318);
 return new Promise(r=>cv.toBlob(r,'image/png'))}
