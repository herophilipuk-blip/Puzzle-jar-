  if(m){const ap=b.getAttribute('aria-pressed'),on=ap!==null?ap==='true':/^On$/i.test(m[2].trim()),off=ap!==null?ap!=='true':/^Off$/i.test(m[2].trim());b.innerHTML='<span class="pjl">'+esc(m[1].trim())+'</span>'+((on||off)?'<span class="pjsw'+(on?' on':'')+'"><i></i></span>':'<span class="pjv">'+esc(m[2].trim())+'</span>')}
  else if(!b.querySelector('.pjl')&&raw.trim())b.innerHTML='<span class="pjl">'+esc(raw.trim())+'</span><span class="pjv"></span>';
  setTimeout(()=>{busy=false},0)};
 new MutationObserver(run).observe(b,{childList:true,characterData:true,subtree:true});run()}
function buildSettings(){
 const set=$('set'),card=set&&set.querySelector('.card');if(!card||card.dataset.v16)return;card.dataset.v16='1';
 const find=t=>Array.from(card.querySelectorAll('button')).find(b=>b.textContent.indexOf(t)>-1),acc=find('Account & backup'),mr=find('Match requests');
 ['anb','ntb','rwb'].forEach(id=>{const e=$(id);if(e)e.style.display='none'});if(mr)mr.style.display='none';
 try{if(localStorage.getItem('pf_mr')==='0')localStorage.setItem('pf_mr','1')}catch(e){}      /* match requests: always on */
 const mk=t=>{const g=document.createElement('div');g.className='pjg';if(t){const h=document.createElement('div');h.className='pjgh';h.textContent=t;g.appendChild(h)}return g};
 const gS=mk('Sound'),gA=mk('Accessibility'),gU=mk('Account'),gM=mk(''),det=document.createElement('details');det.className='pjmore';const sm=document.createElement('summary');sm.textContent='More options';det.appendChild(sm);det.appendChild(gM);

 const done=$('closeSet');[gS,gA,gU,det].forEach(n=>card.insertBefore(n,done));

 if($('gfx'))return;
 const gb=document.createElement('button');gb.id='gfx';gb.className='opt';$('closeSet').before(gb);gfxLabel();
 gb.onclick=()=>{perfMode=perfMode==='auto'?'low':perfMode==='low'?'high':'auto';localStorage.setItem('pf_perf',perfMode);if(perfMode==='auto')localStorage.removeItem('pf_perfauto');applyPerf();gfxLabel();toast(perfMode==='low'?'Smooth mode: lighter effects':perfMode==='high'?'Full effects':'Graphics: Auto')};

   9. NOTIFICATIONS: the normal phone permission prompt, asked once
   ========================================================= */
function askNotifyNative(){
 if(!('Notification' in window))return;
 if(Notification.permission==='granted'){if(PUSH.vapidKey&&!localStorage.getItem('pf_pt'))enablePush().catch(()=>{});return}
 if(Notification.permission!=='default'||localStorage.getItem('pf_ntask'))return;
 localStorage.setItem('pf_ntask','1');
 try{Promise.resolve(Notification.requestPermission()).then(p=>{if(p==='granted')enablePush().catch(()=>{})}).catch(()=>{})}catch(e){}}
const startN=start;start=function(){const r=startN.apply(this,arguments);try{if(maxLv>=2&&level>=2)setTimeout(askNotifyNative,2600)}catch(e){}return r};

const hadSW=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.upd&&hadSW)banner({ic:'⬆️',t:'Update ready',s:'Tap to get the latest Puzzle Jar',go:()=>location.reload(),ms:12000})})}

  if(t-t0<2500&&!document.hidden)requestAnimationFrame(f);
  else{sampling=false;ds.splice(0,8);if(ds.length>20){ds.sort((a,b)=>a-b);const med=ds[ds.length>>1],p90=ds[(ds.length*.9)|0];if(med>28||p90>60){localStorage.setItem('pf_perfauto','low');applyPerf();gfxLabel();toast('⚡ Smooth mode on for faster play (change in Settings)')}}}};
 setTimeout(()=>requestAnimationFrame(f),900)}
const start0=start;start=function(){const r=start0.apply(this,arguments);try{sampleFrames();if(level<=2&&!daily&&!localStorage.getItem('pf_clkseen')){localStorage.setItem('pf_clkseen','1');setTimeout(()=>toast('⏱ Beat the clock for bonus coins!'),1400)}}catch(e){}return r};
try{(window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}})}catch(e){}

   ========================================================= */
const bm0=buildMap;buildMap=function(){const r=bm0.apply(this,arguments);
 try{document.querySelectorAll('#mapInner .sj').forEach(b=>{if(b.querySelector('.twb'))return;const n=+(b.getAttribute('aria-label')||'').replace(/\D/g,''),k=n&&twistLv(n);if(k){const e=document.createElement('em');e.className='twb';e.textContent=TWD[k].ic;b.appendChild(e)}})}catch(e){}return r};
try{buildMap()}catch(e){}

   10. FRIENDLY ERRORS: always say what actually happened
   ========================================================= */
let lastOff=0,lastErr=0;

window.addEventListener('error',calm);window.addEventListener('unhandledrejection',calm);
})();

   :'<h3>Puzzle Jar</h3>'+R('🫙','Endless colour sorting','New levels, new twists, always one more jar.')+R('🌍','Play with the world','Race friends, climb the ranks, become a Speed King.')+R('✨','Version 106','Made with love.'))+'<button class="x">Close</button></div>';

/* ---------- 2. FLYING COINS with a proper coin sound ---------- */
let lastTap={x:innerWidth/2,y:innerHeight*.45,t:0};
document.addEventListener('pointerdown',e=>{lastTap={x:e.clientX,y:e.clientY,t:Date.now()}},true);
function target(){const m=$('map'),inGame=m&&m.classList.contains('off');const a=inGame?$('coins'):$('mcoins');return a&&a.getBoundingClientRect().width?a:($('mcoins')||$('coins'))}
function setChipNum(el,val){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n,last=null;while((n=w.nextNode()))if(/\d/.test(n.data))last=n;if(last){const s=(window.pjK?pjK(val):String(val));last.data=last.data.replace(/\d[\d.,]*[KM]?/,s)}}
function tink(i){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime,f=[1318.5,1568,1760,2093,2349][i%5],o=OUT();
 [[f,.17],[f*1.5,.08]].forEach(([fr,v])=>{const x=ac.createOscillator(),g=ac.createGain();x.type='sine';x.frequency.value=fr;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.16);x.connect(g);g.connect(o);x.start(t);x.stop(t+.18)})}catch(e){}}
function chaching(){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+.01,o=OUT();[784,987.8,1174.7,1568].forEach((f,k)=>{const x=ac.createOscillator(),g=ac.createGain();x.type='triangle';x.frequency.value=f;g.gain.setValueAtTime(.0001,t+k*.055);g.gain.linearRampToValueAtTime(.16,t+k*.055+.01);g.gain.exponentialRampToValueAtTime(.0001,t+k*.055+.3);x.connect(g);g.connect(o);x.start(t+k*.055);x.stop(t+k*.055+.34)})}catch(e){}}
function pop(){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,x=ac.createOscillator(),g=ac.createGain();x.frequency.setValueAtTime(500,t);x.frequency.exponentialRampToValueAtTime(900,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);x.connect(g);g.connect(OUT());x.start(t);x.stop(t+.12)}catch(e){}}
window.pjCoinFly=function(n,old,from){
 try{if(!(n>0))return;const tg=target();if(!tg)return;const r=tg.getBoundingClientRect(),tx=r.left+Math.min(26,r.width*.25),ty=r.top+r.height/2;
  from=from||(Date.now()-lastTap.t<2500?lastTap:{x:innerWidth/2,y:innerHeight*.45});
  const k=Math.min(14,Math.max(5,Math.ceil(n/5))),per=Math.ceil(n/k),low=document.body.dataset.perf==='low';let shown=old!=null?old:null,landed=0;
  if(shown!=null)setChipNum(tg,shown);pop();
  for(let i=0;i<(low?Math.min(k,7):k);i++){
   const e=document.createElement('span');e.className='pji pjfly';e.setAttribute('data-e','🪙');e.textContent='🪙';e.style.left=from.x+'px';e.style.top=from.y+'px';document.body.appendChild(e);
   const a=Math.random()*6.283,r1=26+Math.random()*54,bx=Math.cos(a)*r1,by=Math.sin(a)*r1-28,dx=tx-from.x,dy=ty-from.y,T=(x,y,s)=>'translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px)) scale('+s+')';
   const an=e.animate([{transform:T(0,0,.2),opacity:0},{transform:T(bx,by,1.15),opacity:1,offset:.26,easing:'ease-out'},{transform:T(bx,by+7,1),opacity:1,offset:.4},{transform:T(dx,dy,.55),opacity:1}],{duration:900,delay:i*65,easing:'cubic-bezier(.5,0,.6,1)',fill:'both'});
   an.onfinish=()=>{e.remove();landed++;tink(i);tg.animate([{transform:'scale(1)'},{transform:'scale(1.16)'},{transform:'scale(1)'}],{duration:170});
    if(shown!=null){shown=landed>=k?old+n:Math.min(old+n,shown+per);setChipNum(tg,shown)}
    if(landed>=Math.min(k,low?7:k)){chaching();try{if(typeof render==='function')render()}catch(x){}}}}
 }catch(e){}};

/* ---------- 3. EVERY LEVEL GETS ITS OWN BEAUTIFUL BACKGROUND ---------- */
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]}
const hex=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
function lum(c){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])}
window.pjPalette=function(L){
 L=Math.max(1,L|0);let H=(L*137.508+210)%360;if(H>38&&H<84)H+=52;   /* skip muddy olive/brown range */
 const tier=Math.floor((L-1)/6)%4,H2=H+36+24*Math.sin(L*.9),S=74+9*Math.sin(L/5);
 const a=hsl(H,S,[31,27,34,29][tier]),b=hsl(H2,S+4,[17,13,20,12][tier]);
 return{a:hex(a),b:hex(b),dark:true,la:lum(a),lb:lum(b)}};
const at0=window.applyTheme;

 try{if(typeof THEMES!=='undefined'&&THEMES[theme]&&THEMES[theme].a&&owned.includes(theme))return;     /* a bought theme always wins */

 }catch(e){}};

/* ---------- 4. REMINDERS (9:00 and 20:00, gentle) ---------- */
function remindOn(){return 'Notification' in window&&Notification.permission==='granted'&&localStorage.getItem('pf_rem')!=='0'&&!!localStorage.getItem('pf_pt')}

 try{if(!remindOn())return;const now=Date.now();if(!force&&now-lastSync<10*6e4)return;lastSync=now;

  const rw=jget('pf_rw',{}),ms=(rw.ms&&rw.ms.d===(window.dayIdx?dayIdx():-1))?(rw.ms.a||[]).filter(x=>x.h<x.n).length:3;
  await FDB.ref('remind/'+off+'/'+FUID).update({l:now,lp:+(localStorage.getItem('pf_lp')||now),d:(lastDay===dayIdx())?1:0,m:ms,s:streak||0,lg:(window.PJL&&PJL.get&&PJL.get()!=='xx')?PJL.get():'en',on:1});

/* ---------- 5. MATCH RESULTS SAY WHY, AND NEVER LIE ---------- */
window.pjWhy=function(v,w,me){
 try{const rs=v.res||{},o=Object.keys(v.nm||{}).find(u=>u!==FUID)||Object.keys(rs).find(u=>u!==FUID),mine=rs[FUID]||{},theirs=rs[o]||{};

  return me?Tt('You sorted every jar first.'):Tt('They sorted every jar first.')}catch(e){return''}};

<script id="pj-v20-js">
/* =========================================================
   v20: SPEED HALL. Every level has a Speed King. Crowns, badges, boards,
   all connected: menu, ranks, win screen, in-level chip, map long-press, profile.
   ========================================================= */
(function(){'use strict';
const $=id=>document.getElementById(id);
const jget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>{const s=ms/1000,m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(1)};
const ic=e=>'<span class="pji" data-e="'+e+'">'+e+'</span>';
const SK='pf_sp',QK='pf_spq';
const tier=(k,r)=>k>=40?{i:'👑',n:'Lightning Legend'}:k>=15?{i:'☄',n:'Comet'}:k>=5?{i:'🚀',n:'Rocket'}:k>=1?{i:'⚡',n:'Speedster'}:r>=1?{i:'⏱',n:'Fast Fingers'}:null;
const crownsTxt=n=>n+(n===1?' crown':' crowns'),recTxt=n=>n+(n===1?' record':' records');
const flagOf=c=>{try{return c&&window.flag?flag(c):''}catch(e){return''}};
const elig=()=>!daily&&!(typeof PRACTICE!=='undefined'&&PRACTICE);

/* ---------- stopwatch: from the moment the board appears, minus pauses ---------- */
let S={on:false,act:0,last:performance.now()};
const OV=['set','win','pjsb','rw','pjmenu','pjlang','pcard','soc','acc','prof','lb','pick','da'];
const paused=()=>document.hidden||OV.some(i=>{const e=$(i);return e&&e.classList.contains('on')});
setInterval(()=>{const n=performance.now();if(S.on&&!won&&!paused())S.act+=Math.min(1000,n-S.last);S.last=n},200);
const start1=window.start;window.start=function(){const r=start1.apply(this,arguments);S={on:true,act:0,last:performance.now()};setTimeout(chipUpdate,600);return r};

/* ---------- data ---------- */
const kc=new Map();
async function D(){await mpInit();return FDB}
async function kingOf(L,fresh){if(!fresh&&kc.has(L)&&Date.now()-kc.get(L).at<6e4)return kc.get(L).v;const d=await D(),s=await d.ref('speedKing/'+L).get(),v=s.val();kc.set(L,{v,at:Date.now()});return v}
async function topOf(L){const d=await D(),s=await d.ref('speed/'+L).orderByChild('t').limitToFirst(10).get(),a=[];s.forEach(c=>{a.push(Object.assign({u:c.key},c.val()))});return a}
async function rankOf(L,t){const d=await D(),s=await d.ref('speed/'+L).orderByChild('t').endAt(t-1).limitToFirst(99).get();return s.numChildren()+1}
async function kingsOfUser(u){const d=await D(),s=await d.ref('speedKing').orderByChild('u').equalTo(u).get(),a=[];s.forEach(c=>{a.push(Object.assign({L:+c.key},c.val()))});return a.sort((x,y)=>y.L-x.L)}
async function newest(){const d=await D(),s=await d.ref('speedKing').orderByChild('at').limitToLast(20).get(),a=[];s.forEach(c=>{a.push(Object.assign({L:+c.key},c.val()))});return a.reverse()}
async function topKings(){const d=await D(),s=await d.ref('speedStats').orderByChild('k').limitToLast(50).get(),a=[];s.forEach(c=>{const v=c.val();if(v&&v.k>0)a.push(Object.assign({u:c.key},v))});return a.reverse()}
let myCrowns=new Set(),myCrownsAt=0;
async function loadMine(force){if(!force&&Date.now()-myCrownsAt<3e5)return myCrowns;try{await mpInit();const a=await kingsOfUser(FUID);myCrowns=new Set(a.map(x=>x.L));myCrownsAt=Date.now();markMap()}catch(e){}return myCrowns}

/* ---------- submit after a win (works offline: it is queued and retried) ---------- */
async function submit(L,t,mv){
 const loc=jget(SK,{}),prev=loc[L],pb=!prev||t<prev.t;if(pb){loc[L]={t,mv,at:Date.now()};jset(SK,loc)}
 const res={pb,t,mv,rank:null,king:null,crown:false,off:false};
 try{const d=await D(),me=FUID,ref=d.ref('speed/'+L+'/'+me),sn=await ref.get(),old=sn.exists()?sn.val().t:Infinity,TS=firebase.database.ServerValue.TIMESTAMP;
  if(t<old)await ref.set({t,mv,n:nick,c:country||'',at:TS});
  const best=Math.min(t,old);res.best=best;
  const kr=d.ref('speedKing/'+L),king=(await kr.get()).val();
  if(!king||best<king.t){await kr.set({u:me,t:best,mv,n:nick,c:country||'',at:TS});res.crown=!king||king.u!==me;res.king={u:me,t:best,n:nick};kc.delete(L);myCrowns.add(L)}else res.king=king;
  res.rank=await rankOf(L,best)}catch(e){res.off=true;const q=jget(QK,[]);if(!q.some(x=>x.L===L&&x.t<=t)){q.push({L,t,mv});jset(QK,q.slice(-60))}}
 return res}
async function flushQ(){const q=jget(QK,[]);if(!q.length||!navigator.onLine)return;jset(QK,[]);for(const x of q){try{await submit(x.L,x.t,x.mv)}catch(e){}}}
window.addEventListener('online',()=>setTimeout(flushQ,1500));setTimeout(flushQ,8000);

/* ---------- the win screen line ---------- */
const win1=window.win;
window.win=function(){const was=won;win1.apply(this,arguments);try{if(!was&&won)speedWin()}catch(e){}};
function speedWin(){
 if(!elig())return;const L=level,t=Math.round(S.act),mv=moves;S.on=false;
 let box=$('wspd');if(!box){box=document.createElement('button');box.id='wspd';box.type='button';$('wmsg').after(box)}
 if(!(mv>=3&&t>=mv*220&&t<=216e5)){box.style.display='none';return}
 box.style.display='';box.className='wspd';box.onclick=()=>open('level',L);
 box.innerHTML='<div class="r1">'+ic('⏱')+' Speed time: '+fmt(t)+'</div><div class="r2 dim">Loading speed records…</div>';
 submit(L,t,mv).then(r=>{
  if(!$('win').classList.contains('on')||level!==L)return;
  let h='';
  if(r.crown){box.classList.add('crown');h='<div class="r0">'+ic('👑')+' NEW SPEED KING!</div><div class="r1">You are the Speed King of Level '+L+'!</div><div class="r2">'+ic('⏱')+' Speed time: '+fmt(t)+'</div>';
   try{coins+=50;save();render();window.pjCoinFly&&pjCoinFly(50,coins-50,{x:innerWidth/2,y:innerHeight*.4})}catch(e){}markMap()}
  else{h='<div class="r1">'+ic('⏱')+' Speed time: '+fmt(t)+'</div>'+(r.pb?'<div class="r2"><b class="pbt">🏅 New personal best!</b></div>':'');
   if(r.rank)h+='<div class="r2">'+ic('⚡')+' #'+(r.rank>=100?'100+':r.rank)+' on this level</div>';
   if(r.score)h+='<div class="r2">'+ic('⚡')+' Speed score '+nf(r.score.p)+(r.srank?' · #'+r.srank:'')+'</div>';if(r.king)h+='<div class="r2">'+ic('👑')+' King: '+esc(r.king.n)+' · '+fmt(r.king.t)+'</div>';
   if(r.off)h+='<div class="r2 dim">'+'Loading speed records…'.replace('Loading speed records…','')+'</div>'}
  box.innerHTML=h});
}

/* ---------- in-level chip: who is King here? ---------- */

setInterval(()=>{const c=$('spchip');if(c&&c.style.display!=='none'&&!$('map').classList.contains('off'))c.style.display='none'},700);

/* ---------- the Hall ---------- */
let H={tab:'kings',L:1,view:null};
function shell(){

 o.innerHTML='<div class="sbp"><div class="sbh"><h2>⚡ Speed Hall</h2><button class="sbx" aria-label="Close">✕</button></div><div class="sbt"><button data-t="kings">🏆 Speed Rank</button><button data-t="level">Level board</button><button data-t="mine">My records</button></div><div class="sbb"></div></div>';
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)close()};o.querySelector('.sbx').onclick=close;
 o.querySelectorAll('.sbt button').forEach(b=>b.onclick=()=>open(b.dataset.t));return o}
function close(){const o=$('pjsb');if(o)o.classList.remove('on')}

function open(tab,arg,name){

  if(!h)h=msg('No Speed Kings yet. Win a level fast to be the first!');

async function viewLevel(L){
 L=Math.max(1,L|0);H.L=L;const b=body();
 const ctl='<div class="sbctl"><button class="st" data-d="-1" aria-label="Previous level">‹</button><input id="sbL" type="number" inputmode="numeric" min="1" value="'+L+'" aria-label="Level"><button class="st" data-d="1" aria-label="Next level">›</button><button class="go">Go</button></div>';

 const go=n=>{open('level',n)};
 b.querySelectorAll('.st').forEach(x=>x.onclick=()=>go(L+ +x.dataset.d));b.querySelector('.go').onclick=()=>go(+$('sbL').value||L);$('sbL').onkeydown=e=>{if(e.key==='Enter')go(+$('sbL').value||L)};
 try{const top=await topOf(L);if(H.tab!=='level'||H.L!==L)return;const me=(await D(),FUID),loc=jget(SK,{})[L];let h='';

  else if(!loc&&top.length)h+='<div class="sbme dim">Beat the King’s time</div>';

  $('sbl').innerHTML=h;wire($('sbl'));

  const c=b.querySelector('.chal');if(c)c.onclick=()=>{const t=loc.t;try{PJShare({kind:'challenge',head:'Beat my time: '+fmt(t),sub:'Level '+L+' · can you do better?',stats:[['⏱','Time',fmt(t)],['👣','Moves',loc.mv],['⭐','Level',L]],name:nick,cta:'Beat me!  ▶'},'I cleared Level '+L+' in '+fmt(t)+' on Puzzle Jar. Beat my time!',location.origin+location.pathname+'#sb='+L)}catch(e){}}}
 catch(e){if(H.tab==='level')$('sbl').innerHTML=msg('Couldn’t load speed records. Check your connection.')}}

 const b=body();b.innerHTML='<button class="sbback">‹ Back</button><h3>Crowns of '+esc(name||'')+'</h3><div id="sbl">'+msg('Loading speed records…')+'</div>';
 b.querySelector('.sbback').onclick=()=>open('kings');
 try{const a=await kingsOfUser(u);if(H.tab!=='crowns')return;let h='';a.forEach(k=>{h+=row({attr:'data-L="'+k.L+'" data-a="level"',html:'<span class="rk sm">Level '+k.L+'</span><span class="nm">'+ic('👑')+'</span><span class="vl">'+fmt(k.t)+'<small>'+k.mv+' moves</small></span>'})});
  $('sbl').innerHTML=h||msg('Nobody has a record here yet. Be the first!');wire($('sbl'))}catch(e){$('sbl').innerHTML=msg('Couldn’t load speed records. Check your connection.')}}
async function viewMine(){
 const b=body(),loc=jget(SK,{}),keys=Object.keys(loc).map(Number).sort((x,y)=>y-x);
 b.innerHTML='<div id="sbsum"></div><h3>Records</h3><div id="sbl"></div>';
 const draw=()=>{const k=myCrowns.size,t=tier(k,keys.length);
  $('sbsum').innerHTML='<div class="sbbadge">'+(t?ic(t.i)+'<div><b>'+t.n+'</b><small><span>'+crownsTxt(k)+'</span> · <span>'+recTxt(keys.length)+'</span></small></div>':'<div><small><span>'+recTxt(keys.length)+'</span></small></div>')+'</div>';
  let h='';keys.forEach(L=>{const r=loc[L];h+=row({attr:'data-L="'+L+'" data-a="level"',html:'<span class="rk sm">Level '+L+'</span><span class="nm">'+(myCrowns.has(L)?ic('👑'):'')+'</span><span class="vl">'+fmt(r.t)+'<small>'+r.mv+' moves</small></span>'})});
  $('sbl').innerHTML=h||msg('Nobody has a record here yet. Be the first!');wire($('sbl'));scanTr($('sbsum'))};
 draw();loadMine(true).then(()=>{if(H.tab==='mine')draw()})}
function scanTr(el){/* the language layer watches the DOM; nothing to do */}
function wire(root){root.querySelectorAll('.sbr').forEach(x=>x.onclick=()=>{const a=x.dataset.a;if(a==='level')open('level',+x.dataset.L);else if(a==='crowns')open('crowns',x.dataset.u,x.dataset.n);else if(a==='player')open('player',x.dataset.u,x.dataset.n)})}

/* ===== v22: Speed Rank = most levels, cleared fastest ===== */
const PSK='pf_spp',nf=n=>(+n||0).toLocaleString('en-US'),sAv=n=>{try{return avOf(n)}catch(e){return'🦊'}};
const fa=ms=>{const s=ms/1000;return s<100?s.toFixed(1)+'s':Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')};
const ptsOf=(L,best,kt)=>Math.max(5,Math.round(100*Math.min(1,kt/best)*(1+Math.min(1,L/150))));
function myTotals(){const loc=jget(SK,{}),pp=jget(PSK,{});let p=0,c=0,t=0;Object.keys(loc).forEach(L=>{c++;t+=loc[L].t;p+=pp[L]||0});return{p,c,a:c?Math.round(t/c):0}}
async function writeScore(){const d=await D(),m=myTotals();if(!m.c||!m.p)return null;await d.ref('speedScore/'+FUID).set({p:m.p,c:m.c,a:m.a,n:nick,ct:country||'',at:firebase.database.ServerValue.TIMESTAMP});return m}
async function rankScore(p){const d=await D(),s=await d.ref('speedScore').orderByChild('p').startAt(p+1).limitToFirst(99).get();return s.numChildren()+1}
async function pushScore(L,r){if(r.off)return;const loc=jget(SK,{}),rec=loc[L];if(!rec)return;const best=r.best||rec.t,kt=(r.king&&r.king.t)||best,pp=jget(PSK,{}),pts=ptsOf(L,best,kt);pp[L]=pts;jset(PSK,pp);
 const d=await D();await d.ref('speedLv/'+FUID+'/'+L).set({t:best,mv:rec.mv||r.mv,p:pts});
 const m=await writeScore();if(m){r.score=m;r.srank=await rankScore(m.p)}
 const g=window.pjTarget;if(g&&g.L===L){window.pjTarget=null;toast(best<g.t?'🎯 You beat '+g.n+' on Level '+L+'!':'So close! '+g.n+' still leads Level '+L)}}
const sub0=submit;submit=async function(L,t,mv){const r=await sub0.apply(this,arguments);try{await pushScore(L,r)}catch(e){}return r};
let bfD=0;async function backfill(){if(bfD)return;bfD=1;const loc=jget(SK,{}),pp=jget(PSK,{}),d=await D();for(const L of Object.keys(loc).filter(k=>!pp[k]).slice(0,40)){try{const k=await kingOf(+L),r=loc[L],pts=ptsOf(+L,r.t,k?Math.min(k.t,r.t):r.t);await d.ref('speedLv/'+FUID+'/'+L).set({t:r.t,mv:r.mv,p:pts});pp[L]=pts}catch(e){}}jset(PSK,pp);await writeScore()}
const prow=(k,rk,me)=>row({attr:'data-u="'+esc(k.u)+'" data-n="'+esc(k.n||'')+'" data-a="player"',html:'<span class="rk">'+(rk<=3?['🥇','🥈','🥉'][rk-1]:rk)+'</span><span class="pav2">'+sAv(k.n)+'</span><span class="nm">'+esc(k.n||'—')+' '+flagOf(k.ct)+'<small>'+k.c+' levels · Avg '+fa(k.a)+'</small></span><span class="vl">⚡ '+nf(k.p)+'<small>pts</small></span>'},(me?'me ':'')+(rk===1?'king':''));
viewKings=async function(){const b=body();b.innerHTML=msg('Loading speed rank…');
 try{const d=await D();backfill().catch(()=>{});const s=await d.ref('speedScore').orderByChild('p').limitToLast(50).get(),a=[];s.forEach(c=>{const v=c.val();if(v&&v.p>0)a.push(Object.assign({u:c.key},v))});a.reverse();if(H.tab!=='kings')return;
  const m=myTotals();let h='<div class="sbhint">Climb by clearing <b>more levels</b>, <b>faster</b>. Tap a player to see the levels behind their score.</div>';
  if(!a.length)h+=msg('No speed scores yet. Win a level fast to get on the board!');
  a.forEach((k,i)=>{h+=prow(k,i+1,k.u===FUID)});
  if(m.c&&!a.some(k=>k.u===FUID))h+='<div class="sbme">You: ⚡ '+nf(m.p)+' pts · '+m.c+' levels · Avg '+fa(m.a)+'</div>';
  b.innerHTML=h;wire(b)}catch(e){b.innerHTML=msg('Couldn’t load the speed rank. Check your connection.')}};
async function viewPlayer(u,name){const b=body();b.innerHTML='<button class="sbback">‹ Back</button><div id="sbl">'+msg('Loading…')+'</div>';b.querySelector('.sbback').onclick=()=>open('kings');
 try{const d=await D(),[ss,ls]=await Promise.all([d.ref('speedScore/'+u).get(),d.ref('speedLv/'+u).get()]);if(H.tab!=='player')return;
  const sc=ss.val()||{},a=[];ls.forEach(c=>{a.push(Object.assign({L:+c.key},c.val()))});a.sort((x,y)=>y.p-x.p||x.t-y.t);
  const m=myTotals(),mine=jget(SK,{}),isMe=u===FUID,gap=(sc.p||0)-m.p;
  let h='<div class="sbbadge"><span class="pav2 big">'+sAv(name)+'</span><div><b>'+esc(name||sc.n||'')+'</b><small>⚡ '+nf(sc.p)+' pts · '+(sc.c||a.length)+' levels · Avg '+fa(sc.a||0)+'</small></div></div>';
  if(!isMe)h+='<div class="sbme">'+(gap>=0?'To pass '+esc(name)+' you need '+nf(gap+1)+' more pts: clear more levels, or beat the times below.':'You are ahead of '+esc(name)+' on points. Keep going!')+'</div>';
  h+='<h3>Levels behind this score</h3>';
  a.forEach(r=>{const my=mine[r.L],lead=my&&my.t<=r.t;h+='<div class="sbr lv"><span class="rk sm">Lv '+r.L+'</span><span class="nm">'+fmt(r.t)+'<small>'+(my?'You '+fmt(my.t):'You: not played')+' · +'+r.p+' pts</small></span>'+(isMe?'':'<button class="tk" data-L="'+r.L+'" data-t="'+r.t+'"'+(lead?' disabled':'')+'>'+(lead?'✓ You lead':'🎯 Take this spot')+'</button>')+'</div>'});
  if(!a.length)h+=msg('No level records yet.');
  $('sbl').innerHTML=h;
  b.querySelectorAll('.tk').forEach(x=>x.onclick=()=>{const L=+x.dataset.L;if(L>maxLv){toast('Reach Level '+L+' first');return}window.pjTarget={L,t:+x.dataset.t,n:name,u};close();daily=false;level=L;try{save()}catch(e){}try{closeMap()}catch(e){}start();toast('🎯 Beat '+name+': '+fmt(+x.dataset.t))})}
 catch(e){if(H.tab==='player')$('sbl').innerHTML=msg('Couldn’t load this player. Check your connection.')}}

 const loc=jget(SK,{}),n=Object.keys(loc).length,paint=()=>{const t=tier(myCrowns.size,n);b.innerHTML=(t?ic(t.i)+' <b>'+t.n+'</b> · '+crownsTxt(myCrowns.size):ic('⚡')+' Speed Hall')};paint();loadMine(false).then(paint)}catch(e){}return r};

(function(){const m=$('mapInner');if(!m)return;let tm=0,sw=0;
 m.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.sj');if(!b)return;const n=+(b.getAttribute('aria-label')||'').replace(/\D/g,'');if(!n)return;clearTimeout(tm);tm=setTimeout(()=>{sw=Date.now();try{navigator.vibrate&&navigator.vibrate(20)}catch(x){}open('level',n)},480)},true);
 ['pointerup','pointercancel','pointermove'].forEach(ev=>m.addEventListener(ev,()=>clearTimeout(tm),true));
 m.addEventListener('click',e=>{if(Date.now()-sw<900){e.stopPropagation();e.preventDefault()}},true)})();
setTimeout(()=>{if(!localStorage.getItem('pf_sphint')&&maxLv>=6&&$('map')&&!$('map').classList.contains('off')){localStorage.setItem('pf_sphint','1');toast('Hold a level to see its Speed Board.')}},9000);

if(/^#sb=(\d+)/.test(location.hash)){const n=+RegExp.$1;setTimeout(()=>{try{history.replaceState(null,'',location.pathname)}catch(e){}open('level',n)},2500)}

const R={tab:'g',sf:'w',tok:0,det:null};
const skel=n=>Array.from({length:n},()=>'<div class="rsk"></div>').join('');

function build(){
 const lb=$('lb'),card=lb&&lb.querySelector('.card');if(!card||lb.classList.contains('pjr'))return;
 const done=$('closeLb');lb.classList.add('pjr');card.innerHTML='';
 card.insertAdjacentHTML('beforeend','<i class="rsp a">✦</i><i class="rsp b">✧</i><i class="rsp c">✦</i><i class="rsp d">✧</i><i class="rsp e">⚡</i>'
  +'<div class="rhd"><span>Puzzle Jar Ranks</span></div><div id="rme"></div>'
  +'<div id="rtab"><button data-s="g">🌍 Global</button><button data-s="c">My country</button><button data-s="s" class="spd">⚡ Speed</button></div>'
  +'<div id="rsub"></div><div id="rmsg"></div><div id="rlist"></div><div id="rpin"></div>');
 card.appendChild(done);
 $('rtab').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.s));
}
function meCard(){
 if(!nick){nick=mkNick();save()}
 const T=tier(),t=T.t,n=T.n,pr=n?Math.min(100,Math.max(0,Math.round((totalStars-t[1])/(n[1]-t[1])*100))):100,e=$('rme');
 e.style.setProperty('--tc',t[2]);
 e.innerHTML='<span class="rav">'+avOf(nick)+'</span><div class="rmi"><b>'+esc(nick)+'</b><div class="rm2">🛡 '+t[0]+(country?' · '+flag(country):'')+' · Player Lv '+plvl()+'</div><div class="rbar"><u style="width:'+pr+'%"></u></div><small>'+(n?(n[1]-totalStars)+' more ⭐ to reach '+n[0]:'Top league reached')+'</small></div>';
}
function rr(o){
 const c=o.rk<=3?' t'+o.rk:'';
 return '<button class="rr'+c+(o.me?' me':'')+'" data-i="'+esc(o.id)+'"><span class="rn">'+o.rk+'</span>'
 +'<span class="rav sm">'+o.av+'<span class="odot lbdot" data-id="'+esc(o.id)+'"></span></span>'
 +'<span class="rnm"><b>'+esc(o.name)+(o.rk===1?' 👑':'')+'</b><small>'+o.sub+'</small></span><span class="rvl">'+o.right+'</span></button>'}
function dots(root){root.querySelectorAll('.lbdot').forEach(d=>{try{isOnline(d.dataset.id).then(o=>{if(o)d.classList.add('on')})}catch(e){}})}
function reset(){$('lb').classList.remove('det');R.det=null;$('rmsg').textContent='';$('rpin').innerHTML='';$('rlist').innerHTML=skel(6)}

function setTab(t,noLoad){
 R.tab=t;const tok=++R.tok;reset();
 $('rtab').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===t));
 const sub=$('rsub');sub.innerHTML='';
 if(t==='c'){
  sub.innerHTML='<select id="cty" aria-label="Your country"></select>';const s=$('cty');
  s.innerHTML='<option value="">Choose your country</option>'+Object.entries(CTY).map(([k,v])=>'<option value="'+k+'">'+flag(k)+' '+v+'</option>').join('');s.value=country||'';
  s.onchange=()=>{country=s.value;try{save()}catch(e){}meCard();post();setTab('c')}}
 if(t==='s'){
  sub.innerHTML='<div class="rchips"><button data-f="w">🌍 Worldwide</button><button data-f="c">'+(country?flag(country)+' ':'')+'My country</button></div><p class="rhint">Climb by clearing <b>more levels</b>, <b>faster</b>. Tap a player to see the levels behind their score.</p>';
  sub.querySelectorAll('.rchips button').forEach(b=>{b.classList.toggle('on',b.dataset.f===R.sf);b.onclick=()=>{R.sf=b.dataset.f;setTab('s')}})}
 if(noLoad)return;
 (t==='s'?loadS:loadG)(tok).catch(e=>{if(tok!==R.tok)return;$('rlist').innerHTML='';$('rmsg').textContent=t==='s'?'Couldn’t load the speed rank. Check your connection.':'Could not load ranks ('+(e&&(e.code||e.message)||'error')+'). If this says PERMISSION_DENIED, publish the latest firebase_rules.json.'});
}

async function loadG(tok){
 await mpInit();post();window.__rc=window.__rc||{};const ck=R.tab+(country||'');if(window.__rc[ck]&&$('rlist'))$('rlist').innerHTML=window.__rc[ck];
 const Rf=FDB.ref('leaderboard'),pc=R.tab==='c',L=$('rlist'),m=$('rmsg');
 if(pc&&!country){if(tok!==R.tok)return;L.innerHTML='';m.textContent='Pick your country above to see local ranks.';return}
 const s=await (pc?Rf.orderByChild('country').equalTo(country):Rf.orderByChild('score').limitToLast(50)).get(),rows=[];
 s.forEach(c=>{rows.push({id:c.key,...c.val()})});rows.sort((a,b)=>b.score-a.score);
 if(tok!==R.tok)return;
 const top=rows.slice(0,50);m.textContent=top.length?'':'No scores yet. Win a level to post yours.';
 L.innerHTML=top.map((r,i)=>rr({rk:i+1,id:r.id,name:r.name||'Player',av:avOf(r.name),sub:'Lvl '+(r.level||0)+' • '+(r.stars||0)+' <u class="st">★</u>',right:'<span class="fl">'+flag(r.country)+'</span>',me:r.id===FUID,k:'g'})).join('');
 L.querySelectorAll('.rr').forEach((b,i)=>b.onclick=()=>{const r=top[i];openCard({id:r.id,name:r.name,country:r.country,level:r.level,stars:r.stars,rank:i+1})});
 dots(L);window.__rc[ck]=L.innerHTML;
 let mi=rows.findIndex(r=>r.id===FUID),rank=mi>=0?mi+1:null;
 if(rank==null&&!pc){try{const ms=Math.max(0,maxLv-1)*1000+Math.min(999,totalStars|0),q=await Rf.orderByChild('score').startAt(ms+1).limitToFirst(99).get();rank=q.numChildren()+1;if(rank>=100)rank='100+'}catch(e){}}
 if(tok!==R.tok)return;
 $('rpin').innerHTML=rr({rk:rank==null?'—':rank,id:FUID,name:(nick||'You')+' (you)',av:avOf(nick),sub:'Lvl '+Math.max(0,maxLv-1)+' • '+(totalStars|0)+' <u class="st">★</u>',right:'<span class="fl">'+flag(country)+'</span>',me:true,k:'g'});
 const p=$('rpin').querySelector('.rr');if(p)p.onclick=()=>openCard({id:FUID,name:nick,country:country,level:Math.max(0,maxLv-1),stars:totalStars|0,rank:typeof rank==='number'?rank:undefined});
}

/* keep my own points honest: the King's time moves, so re-score a few of my levels every 10 minutes */
async function refreshMine(){
 const x=X();if(!x||Date.now()-x.jget('pf_sprt',0)<6e5)return false;x.jset('pf_sprt',Date.now());
 const loc=x.jget(x.SK,{}),pp=x.jget(x.PSK,{}),keys=Object.keys(loc).map(Number).sort((a,b)=>a-b);if(!keys.length)return false;
 const i0=x.jget('pf_spri',0)%keys.length,n=Math.min(12,keys.length);let ch=false;const d=await x.D();
 for(let k=0;k<n;k++){const L=keys[(i0+k)%keys.length],r=loc[L];
  try{const kg=await x.kingOf(L,true),kt=kg?Math.min(kg.t,r.t):r.t,pts=x.ptsOf(L,r.t,kt);
   if(pts!==pp[L]){await d.ref('speedLv/'+FUID+'/'+L).set({t:r.t,mv:r.mv,p:pts});pp[L]=pts;ch=true}}catch(e){}}
 x.jset('pf_spri',(i0+n)%keys.length);x.jset(x.PSK,pp);if(ch)await x.writeScore();return ch}

async function loadS(tok){
 const x=X(),L=$('rlist');if(!x)throw new Error('speed');
 const d=await x.D();x.backfill().catch(()=>{});
 refreshMine().then(ch=>{if(ch&&R.tab==='s'&&!R.det&&tok===R.tok)loadS(tok).catch(()=>{})}).catch(()=>{});
 const s=await d.ref('speedScore').orderByChild('p').limitToLast(100).get(),a=[];
 s.forEach(c=>{const v=c.val();if(v&&v.p>0)a.push(Object.assign({u:c.key},v))});
 a.sort((p,q)=>q.p-p.p||q.c-p.c||p.a-q.a);
 if(tok!==R.tok)return;
 let list=a;if(R.sf==='c'){list=country?a.filter(v=>v.ct===country):[]}
 list=list.slice(0,50);
 $('rmsg').textContent=list.length?'':(R.sf==='c'&&!country?'Pick your country in the Profile to use this filter.':'No speed scores yet. Win a level fast to get on the board!');
 L.innerHTML=list.map((v,i)=>rr({rk:i+1,id:v.u,name:v.n||'Player',av:avOf(v.n),sub:v.c+' level'+(v.c===1?'':'s')+' • Avg '+fa(v.a),right:'<span class="rcap">Speed Score</span><span>⚡ '+nf(v.p)+' pts</span>',me:v.u===FUID,k:'s'})).join('')
  +'<button class="rfoot" id="rhall">Level boards &amp; my records ›</button>';
 L.querySelectorAll('.rr').forEach((b,i)=>b.onclick=()=>showPlayer(list[i].u,list[i].n));
 $('rhall').onclick=()=>{$('lb').classList.remove('on');window.PJSpeed.open('mine')};
 dots(L);
 const m=x.myTotals();
 if(!m.c){$('rpin').innerHTML='<p class="rhint" style="text-align:center">Win any level to join the Speed board.</p>';return}
 let rank='—';try{rank=await x.rankScore(m.p);if(rank>=100)rank='100+'}catch(e){}
 if(tok!==R.tok)return;
 $('rpin').innerHTML=rr({rk:rank,id:FUID,name:(nick||'You')+' (you)',av:avOf(nick),sub:m.c+' level'+(m.c===1?'':'s')+' • Avg '+fa(m.a),right:'<span class="rcap">Speed Score</span><span>⚡ '+nf(m.p)+' pts</span>',me:true,k:'s'});
 $('rpin').querySelector('.rr').onclick=()=>showPlayer(FUID,nick);
}

async function showPlayer(u,name){
 const x=X(),tok=++R.tok;R.det={u,name};
 const lb=$('lb'),L=$('rlist');lb.classList.add('det');$('rmsg').textContent='';$('rpin').innerHTML='';L.innerHTML=skel(5);
 try{
  const d=await x.D(),[ss,ls]=await Promise.all([d.ref('speedScore/'+u).get(),d.ref('speedLv/'+u).get()]);
  if(tok!==R.tok)return;
  const sc=ss.val()||{},a=[];ls.forEach(c=>{a.push(Object.assign({L:+c.key},c.val()))});
  const mine=x.jget(x.SK,{}),pp=x.jget(x.PSK,{}),mt=x.myTotals(),isMe=u===FUID,gap=(sc.p||0)-mt.p;
  a.forEach(r=>{const my=mine[r.L];r.my=my;r.lead=!!my&&my.t<=r.t;r.gain=r.lead?0:Math.max(0,r.p-(pp[r.L]||0))});
  a.sort(isMe?((p,q)=>q.p-p.p||p.t-q.t):((p,q)=>q.gain-p.gain||q.p-p.p||p.t-q.t));
  const lv=a.length||sc.c||0;
  let h='<button class="rback">‹ Back</button><div class="rdh"><span class="rav big">'+avOf(name)+'</span><div><b>'+esc(name||sc.n||'Player')+'</b><small>⚡ '+nf(sc.p||0)+' pts · '+lv+' level'+(lv===1?'':'s')+' · Avg '+fa(sc.a||0)+'</small></div></div>';
  if(!isMe){
   const pct=sc.p?Math.min(100,Math.round(mt.p/sc.p*100)):100;
   h+='<div class="rgap">'+(gap>=0?'You are <b>'+nf(gap)+'</b> pts behind '+esc(name)+'. You pass them when your total is higher, so clear more levels or beat the times below. One level alone will not do it unless the gap is small.':'You are <b>'+nf(-gap)+'</b> pts ahead of '+esc(name)+'. Keep clearing levels to stay ahead!')+'<div class="rbar"><u style="width:'+pct+'%"></u></div></div>'}
  h+='<div class="rlh">Levels behind this score'+(isMe?'':' · best targets first')+'</div>';
  if(!a.length)h+='<p class="rhint">No level records yet.</p>';
  a.forEach(r=>{const my=r.my,lock=r.L>maxLv;
   h+='<div class="rlv"><button class="lvb" data-b="'+r.L+'" title="Level board">Lv '+r.L+'</button><span class="rlt"><b>'+fa(r.t)+'</b><small>'+(my?'You '+fa(my.t):'You: not played')+' · '+r.mv+' moves'+(!isMe&&!r.lead&&r.gain?' · <span class="gn">+'+r.gain+' pts for you</span>':'')+'</small></span>'
   +(isMe?'<span class="rvl"><span>+'+r.p+'</span></span>':'<button class="tk'+(lock?' lk':'')+'" data-L="'+r.L+'" data-t="'+r.t+'"'+(r.lead?' disabled':'')+'>'+(r.lead?'✓ You lead':lock?'🔒 Reach Lv '+r.L:'🎯 Take this spot')+'</button>')+'</div>'});
  L.innerHTML=h;L.scrollTop=0;
  L.querySelector('.rback').onclick=()=>setTab(R.tab);
  L.querySelectorAll('.lvb').forEach(b=>b.onclick=()=>{lb.classList.remove('on');window.PJSpeed.open('level',+b.dataset.b)});
  L.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{const Lv=+b.dataset.L,t=+b.dataset.t;
   if(Lv>maxLv){toast('Reach Level '+Lv+' first');return}
   window.pjTarget={L:Lv,t,n:name,u};lb.classList.remove('on');daily=false;level=Lv;try{save()}catch(e){}try{closeMap()}catch(e){}start();toast('🎯 Beat '+name+': '+fa(t))});
 }catch(e){if(tok===R.tok){L.innerHTML='<button class="rback">‹ Back</button><p class="rhint">Couldn’t load this player. Check your connection.</p>';L.querySelector('.rback').onclick=()=>setTab(R.tab)}}
}

window.openLb=function(tab,u,name){
 build();$('lb').classList.add('on');meCard();
 const t=(tab==='g'||tab==='c'||tab==='s')?tab:R.tab;
 if(u){setTab('s',true);showPlayer(u,name)}else setTab(t)};
window.pjRanksOpen=window.openLb;
const tr=$('trophy');if(tr)tr.onclick=()=>window.openLb();
})();
</script>

<script>
(function(){try{if((navigator.deviceMemory&&navigator.deviceMemory<=3)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4))document.documentElement.classList.add('lite')}catch(e){}
var b=document.createElement('button');b.id='goMe';b.setAttribute('aria-label','Go to my level');document.body.appendChild(b);var raf=0,hideT=0,UP='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',DN='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function modal(){return !!document.querySelector('.sovl.on,#lb.on,#soc.on,#da.on,#win.on,#set.on,#tu,#pcard.on,.mpm.on')}
function hide(){b.classList.remove('on')}
function upd(){raf=0;var sc=document.getElementById('mapScroll');if(modal()||!sc||sc.offsetParent===null||!sc.clientHeight){hide();return}var cu=sc.querySelector('.sj.cur');if(!cu){hide();return}var r=cu.getBoundingClientRect(),c=sc.getBoundingClientRect(),dir=r.bottom<c.top?'up':r.top>c.bottom?'dn':'';if(!dir){hide();return}b.innerHTML=dir==='up'?UP:DN;b.classList.add('on');clearTimeout(hideT);hideT=setTimeout(hide,2600)}
function q(e){if(modal()){hide();return}if(e&&e.target&&e.target.id!=='mapScroll'&&!(e.target.closest&&e.target.closest('#mapScroll')))return;if(!raf)raf=requestAnimationFrame(upd)}
b.onclick=function(){var cu=document.querySelector('#mapScroll .sj.cur');if(cu)cu.scrollIntoView({block:'center',behavior:'smooth'});hide()};
document.addEventListener('scroll',q,true)})();

<script id="pj105-js">
(function(){
const $=id=>document.getElementById(id),on=e=>!!(e&&e.classList.contains('on'));
/* one overlay at a time: toast, twist intro and friend banners queue behind each other */
window.pjOvT=()=>on($('pjban'))||on($('twintro'));
window.pjOvB=f=>f?(on($('toast'))||on($('pjban'))):(on($('toast'))||on($('twintro')));
/* standard chevron instead of font arrows */
const CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';let pend=0;
function fix(){pend=0;document.querySelectorAll('button').forEach(b=>{if(b.dataset.pjc||b.closest('#da')||b.closest('.sbctl'))return;const t=b.firstChild;if(!t||t.nodeType!==3)return;const m=/^\s*[‹←]\s*/.exec(t.nodeValue);if(!m)return;t.nodeValue=t.nodeValue.slice(m[0].length);const w=document.createElement('span');w.className='pjchw';w.innerHTML=CH;b.insertBefore(w,t);if(!t.nodeValue.trim())t.remove();b.dataset.pjc=1})}
new MutationObserver(()=>{if(!pend){pend=1;requestAnimationFrame(fix)}}).observe(document.body,{childList:true,subtree:true});fix();
/* win only when every card is sorted and verified */
const w0=window.win;window.win=function(){if(won&&$('win')&&on($('win')))return;if(!isWon()){won=false;try{render()}catch(e){}return}return w0.apply(this,arguments)};
/* endless levels: if a board is ever broken or unsolvable, build a fresh solvable one */
const g0=window.gen;
function fb(L){const nc=Math.min(11,4+Math.floor(L/15)),r=mul(L*104729+7);let J;
 for(let a=0;a<30;a++){const c=[];for(let i=0;i<nc;i++)for(let k=0;k<CAP;k++)c.push(i);for(let i=c.length-1;i>0;i--){const k=Math.floor(r()*(i+1));[c[i],c[k]]=[c[k],c[i]]}
  J=[];for(let i=0;i<nc;i++)J.push(c.slice(i*CAP,i*CAP+CAP));J.push([],[]);if(J.some(j=>j.length&&full(j)))continue;let ok=true;try{ok=solveBoard(J,150,[],[])!==null}catch(e){}if(ok)break}
 jars=J;LOCKS=[];CONTRACT=[];rnd=mul(L*7919+13);let hid=0;const p=Math.min(.6,.1+L*.01);
 jars.forEach(j=>{for(let k=0;k<j.length-1;k++)if(rnd()<p){j[k]+=100;hid++}});par=nc*3+Math.floor(hid/4);limit=(!daily&&L%10===0)?Math.ceil(par*2):0}
window.gen=function(){let ok=false;
 try{g0.apply(this,arguments);ok=Array.isArray(jars)&&jars.length>=3&&jars.every(j=>Array.isArray(j)&&j.length<=CAP)&&!isWon();if(ok&&solveBoard(jars,150,LOCKS,CONTRACT)===null)ok=false}catch(e){ok=false}
 if(!ok){try{fb(daily?100000+dayIdx():level)}catch(e){}}};
})();
</script>
